groups:
  - name: correctness-invariant-alerts
    rules:
      - alert: AntiEntropyDivergenceDetected
        expr: increase(anti_entropy_divergences_total[15m]) > 0
        for: 0s
        labels:
          severity: page
          owner: orders
        annotations:
          summary: "Anti-entropy sweep found a real divergence between services"
          description: "{{ $value }} divergence(s) on check {{ $labels.check }} in the last 15m - see docs/architecture/milestone-*-anti-entropy* and AntiEntropySweeper's logs for which order(s) diverged."
          runbook_url: "https://github.com/daniloitagyba/SagaEcommerce/blob/main/docs/operations/runbooks.md#stuck-or-failed-saga-compensation"

      - alert: SettlementReconciliationUnresolved
        expr: increase(payments_settlement_reconciliation_unresolved_total[15m]) > 0
        for: 0s
        labels:
          severity: page
          owner: payments
        annotations:
          summary: "A payment settlement could not be reconciled"
          description: "{{ $value }} unresolved settlement(s) with transition_result={{ $labels.transition_result }} in the last 15m - check PaymentSettlementProcessor's logs for the order/payment id."
          runbook_url: "https://github.com/daniloitagyba/SagaEcommerce/blob/main/docs/operations/runbooks.md#stuck-or-failed-saga-compensation"

      - alert: OrphanedSagaRepliesHigh
        expr: increase(saga_orphaned_reply_total[10m]) > 3
        for: 0s
        labels:
          severity: ticket
          owner: orders
        annotations:
          summary: "Saga replies are arriving for state that no longer exists"
          description: "{{ $value }} orphaned {{ $labels.reply_kind }} repl(y/ies) in the last 10m (succeeded={{ $labels.succeeded }}) - check SagaTimeoutSweeper's cadence against reply latency."
          runbook_url: "https://github.com/daniloitagyba/SagaEcommerce/blob/main/docs/operations/runbooks.md#stuck-or-failed-saga-compensation"

      - alert: RateLimitingFailedOpen
        expr: increase(orders_rate_limit_distributed_bypassed_total[5m]) > 0
        for: 0s
        labels:
          severity: page
          owner: orders
        annotations:
          summary: "Distributed rate limiting is failing open"
          description: "{{ $value }} request(s) bypassed distributed rate limiting in the last 5m because Redis was unreachable - orders-api is currently unprotected against a caller exceeding its limit."
          runbook_url: "https://github.com/daniloitagyba/SagaEcommerce/blob/main/docs/operations/runbooks.md#common-first-response"

      - alert: OrderCacheFailingOpen
        expr: rate(orders_cache_bypassed_total[5m]) > 0
        for: 5m
        labels:
          severity: ticket
          owner: orders
        annotations:
          summary: "Order cache reads have been bypassing Redis for 5 minutes"
          description: "GET /orders/{id} has been reading straight from Postgres for at least 5 minutes - Redis is likely unreachable, and Postgres is carrying load the cache would normally absorb."
          runbook_url: "https://github.com/daniloitagyba/SagaEcommerce/blob/main/docs/operations/runbooks.md#common-first-response"

      - alert: FencedWriteRejectedSustained
        expr: rate(orders_redis_fenced_write_rejected_total[10m]) > 0
        for: 10m
        labels:
          severity: ticket
          owner: orders
        annotations:
          summary: "Fenced writes are being rejected on a sustained basis"
          description: "store={{ $labels.store }} has been losing the fencing-token race for 10 minutes straight - the lock timeout is likely too short for the guarded work."
          runbook_url: "https://github.com/daniloitagyba/SagaEcommerce/blob/main/docs/operations/runbooks.md#common-first-response"

      - alert: ProjectionLagHigh
        expr: histogram_quantile(0.95, sum(rate(orders_projection_lag_ms_bucket[5m])) by (le)) > 5000
        for: 5m
        labels:
          severity: ticket
          owner: orders
        annotations:
          summary: "Order projection lag is elevated"
          description: "p95 projection lag has been above 5s for 5 minutes ({{ $value }}ms now) - check OrderEventStoreProjector's consumer group lag and scripts/live-proofs/projection-lag-test.sh."
          runbook_url: "https://github.com/daniloitagyba/SagaEcommerce/blob/main/docs/operations/runbooks.md#kafka-or-broker-outage"
