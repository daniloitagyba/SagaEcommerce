apiVersion: batch/v1
kind: Job
metadata:
  name: compose-connectivity-m6
  labels:
    app.kubernetes.io/name: compose-connectivity
    app.kubernetes.io/component: verification
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compose-connectivity
        app.kubernetes.io/component: verification
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connectivity
          image: alpine:3.22
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              nc -z -w 5 postgres 5432
              nc -z -w 5 kafka 9092
              nc -z -w 5 otel-collector 4317
              echo "Compose infrastructure is reachable from K3s."
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
