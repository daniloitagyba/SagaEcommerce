# Migration/seed Jobs are short-lived workloads with no east-west calls. Their
# image determines which listed store they use; the shared selector keeps
# generated Job names from requiring one policy per migration revision.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-migrations
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: migration }
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: 172.30.0.0/24 } }]
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 27017 }
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4040 }
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 9092 }
