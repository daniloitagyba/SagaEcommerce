apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-health-and-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: saga-ecommerce
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 4143
        - protocol: TCP
          port: 4191
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-application-common
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: saga-ecommerce
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkerd
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8086 }
        - { protocol: TCP, port: 8090 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: saga-ecommerce
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 4143 }
    - to:
        - ipBlock:
            cidr: 172.30.0.0/24
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4040 }
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-orders-api-data
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: orders-api }
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: 172.30.0.0/24 } }]
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 9092 }
        - { protocol: TCP, port: 8081 }
        - { protocol: TCP, port: 6379 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-orders-worker-data
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: orders-worker }
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: 172.30.0.0/24 } }]
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 9092 }
        - { protocol: TCP, port: 8081 }
        - { protocol: TCP, port: 6379 }
    - ports:
        - { protocol: TCP, port: 443 }
---
