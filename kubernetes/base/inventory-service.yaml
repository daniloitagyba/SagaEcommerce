apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/component: worker
spec:
  # 2 replicas is load-bearing for this milestone, not just availability:
  # the same-Sku oversell-prevention test only means something if there is
  # more than one consumer instance in the group that COULD race for a
  # partition. With replicas: 1 the "Kafka partition ownership prevents the
  # race" claim would be untested - correctness would be indistinguishable
  # from there simply being nothing else running.
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: saga-ecommerce
      annotations:
        linkerd.io/inject: enabled
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # Milestone 65: see cart-service.yaml for the full rationale - a
      # no-op on this single-node cluster today, a real guardrail once a
      # second node exists.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: inventory-service
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory-service
          image: saga-ecommerce/inventory-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            # Missing here previously - AddKeycloakJwtBearer throws during
            # service registration without it, before any health check runs.
            # Must match compose.yaml's value.
            - name: Authentication__Authority
              value: http://keycloak:8080/realms/orders-lab
            - name: ConnectionStrings__Inventory
              valueFrom:
                secretKeyRef:
                  name: orders-runtime
                  key: inventory-connection-string
            - name: Kafka__BootstrapServers
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: bootstrap-servers
            - name: Kafka__ReservationRequestedTopic
              value: inventory.reservation-requested.v1
            - name: Kafka__ReservationRepliedTopic
              value: inventory.reservation-replied.v1
            - name: Kafka__CommitRequestedTopic
              value: inventory.reservation-commit-requested.v1
            - name: Kafka__CommitRepliedTopic
              value: inventory.reservation-commit-replied.v1
            - name: Kafka__ReleaseRequestedTopic
              value: inventory.reservation-release-requested.v1
            - name: Kafka__ReleaseRepliedTopic
              value: inventory.reservation-release-replied.v1
            - name: Kafka__DeadLetterTopic
              value: inventory.reservation.dlq.v1
            - name: Kafka__ConsumerGroup
              value: inventory-service
            - name: Kafka__ClientId
              value: inventory-service-k3s
            # OutboxPublisher<InventoryDbContext> - see orders-api's own
            # comment on these five.
            - name: Outbox__BatchSize
              value: "5"
            - name: Outbox__PollIntervalMilliseconds
              value: "500"
            - name: Outbox__MaximumRetryDelaySeconds
              value: "60"
            - name: Outbox__ClaimWindowSeconds
              value: "30"
            - name: Outbox__PendingSampleIntervalSeconds
              value: "10"
            - name: InstanceId
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=orders-lab
            - name: PYROSCOPE_PROFILING_ENABLED
              value: "1"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope:4040
            - name: PYROSCOPE_APPLICATION_NAME
              value: inventory-service
            # The CLR profiler attach variables - moved out of the Dockerfile's
            # own ENV (where they used to be unconditional and applied to
            # every environment, Compose included, regardless of
            # PYROSCOPE_PROFILING_ENABLED above) so a build with no
            # profiling configuration - Compose - genuinely runs with no
            # profiler attached, instead of CORECLR_ENABLE_PROFILING loading
            # one at process startup and only Pyroscope's own
            # PYROSCOPE_PROFILING_ENABLED (read after that point) deciding
            # whether it does anything. The .so files themselves stay baked
            # into the image - only the decision to attach lives here now.
            - name: CORECLR_ENABLE_PROFILING
              value: "1"
            - name: CORECLR_PROFILER
              value: "{BD1A650D-AC5D-4896-B64F-D6FA25D6B26A}"
            - name: CORECLR_PROFILER_PATH
              value: /opt/Pyroscope.Profiler.Native.so
            - name: LD_PRELOAD
              value: /opt/Pyroscope.Linux.ApiWrapper.x64.so
            - name: LD_LIBRARY_PATH
              value: /opt
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  labels:
    app.kubernetes.io/name: inventory-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inventory-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inventory-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
