# The worker's projected token is used only for Kubernetes Lease-based leader
# election. This namespaced Role deliberately grants no Pod, Secret, ConfigMap
# or workload mutation access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orders-worker-leader-election
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orders-worker-leader-election
subjects:
  - kind: ServiceAccount
    name: orders-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orders-worker-leader-election
