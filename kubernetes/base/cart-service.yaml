apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  labels:
    app.kubernetes.io/name: cart-service
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cart-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: saga-ecommerce
      annotations:
        linkerd.io/inject: enabled
    spec:
      serviceAccountName: cart-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # Milestone 65: nothing previously stopped the scheduler from placing
      # every replica on the same node - the PodDisruptionBudget below
      # protects against a voluntary drain, not against a single node
      # failure taking out every replica at once. ScheduleAnyway (not
      # DoNotSchedule) so this never blocks scheduling outright - on this
      # lab's single-node K3s cluster there is only one topology domain to
      # spread across, so it's a no-op today and a real guardrail the
      # moment a second node joins.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cart-service
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cart-service
          image: saga-ecommerce/cart-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Redis__ConnectionString
              value: redis:6379
            - name: Catalog__BaseUrl
              value: http://catalog-service
            # Missing here previously - defaults to KeycloakJwtBearerExtensions'
            # own InvalidOperationException, which throws during
            # AddKeycloakJwtBearer's service registration, before this pod
            # ever reaches a health check. Must match compose.yaml's value.
            - name: Authentication__Authority
              value: http://keycloak:8080/realms/orders-lab
            - name: InstanceId
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=orders-lab
            - name: PYROSCOPE_PROFILING_ENABLED
              value: "1"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope:4040
            - name: PYROSCOPE_APPLICATION_NAME
              value: cart-service
            # The CLR profiler attach variables - moved out of the Dockerfile's
            # own ENV (where they used to be unconditional and applied to
            # every environment, Compose included, regardless of
            # PYROSCOPE_PROFILING_ENABLED above) so a build with no
            # profiling configuration - Compose - genuinely runs with no
            # profiler attached, instead of CORECLR_ENABLE_PROFILING loading
            # one at process startup and only Pyroscope's own
            # PYROSCOPE_PROFILING_ENABLED (read after that point) deciding
            # whether it does anything. The .so files themselves stay baked
            # into the image - only the decision to attach lives here now.
            - name: CORECLR_ENABLE_PROFILING
              value: "1"
            - name: CORECLR_PROFILER
              value: "{BD1A650D-AC5D-4896-B64F-D6FA25D6B26A}"
            - name: CORECLR_PROFILER_PATH
              value: /opt/Pyroscope.Profiler.Native.so
            - name: LD_PRELOAD
              value: /opt/Pyroscope.Linux.ApiWrapper.x64.so
            - name: LD_LIBRARY_PATH
              value: /opt
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  labels:
    app.kubernetes.io/name: cart-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cart-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cart-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cart-service
