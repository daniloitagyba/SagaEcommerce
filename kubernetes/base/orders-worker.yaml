# No PodDisruptionBudget for this Deployment, deliberately - unlike
# cart-service/catalog-service/inventory-service/orders-api/storefront-
# service, which all define one. Its replica count is owned by
# orders-worker-scaledobject.yaml (KEDA), not this manifest, so a static
# minAvailable/maxUnavailable here would fight the same autoscaler
# kubernetes/argocd/application.yaml already tells Argo CD not to fight
# over the replicas field. Don't "fix" this by adding one back.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-worker
  labels:
    app.kubernetes.io/name: orders-worker
    app.kubernetes.io/component: worker
spec:
  # No replicas: here - orders-worker-scaledobject.yaml owns this field
  # (minReplicaCount: 1), and kubernetes/argocd/application.yaml now tells
  # Argo CD to ignore drift on it. Stating a value here would just be the
  # thing Argo CD fights KEDA over on every sync.
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: saga-ecommerce
      annotations:
        linkerd.io/inject: enabled
    spec:
      # Milestone 26: a dedicated ServiceAccount, not the namespace default
      # every other pod still uses - Linkerd's mTLS identity is derived from
      # the pod's ServiceAccount, so sharing "default" across every workload
      # (the case until this milestone) makes per-service AuthorizationPolicy
      # meaningless: every pod would present the same identity. This is what
      # lets kubernetes/cluster-policies/orders-api-authz.yaml distinguish
      # "a request that's actually orders-worker" from "a request that's
      # some other meshed pod."
      serviceAccountName: orders-worker
      # Milestone 36: flipped from false (Milestone 26's hardening default)
      # to true - LeaderElectionService needs the projected ServiceAccount
      # token to authenticate to the API server for Lease read/write.
      # RBAC (kubernetes/cluster-policies/orders-worker-leader-election.yaml)
      # scopes this ServiceAccount to nothing but Lease objects in this one
      # namespace - it still can't read Pods, Secrets, or anything else.
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orders-worker
          image: saga-ecommerce/orders-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__Orders
              valueFrom:
                secretKeyRef:
                  name: orders-runtime
                  key: orders-connection-string
            - name: Kafka__BootstrapServers
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: bootstrap-servers
            - name: Kafka__OrderCreatedTopic
              value: orders.created.v1
            - name: Kafka__DeadLetterTopic
              value: orders.created.dlq.v1
            - name: Kafka__ConsumerGroup
              value: orders-worker
            - name: Kafka__ClientId
              value: orders-worker-k3s
            - name: PaymentResultKafka__BootstrapServers
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: bootstrap-servers
            - name: OrderProjectionKafka__BootstrapServers
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: bootstrap-servers
            - name: SagaOrchestration__BootstrapServers
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: bootstrap-servers
            - name: OrderEventStore__BootstrapServers
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: bootstrap-servers
            - name: SchemaRegistry__Url
              value: http://schema-registry:8081
            - name: Redis__ConnectionString
              value: redis:6379
            - name: Catalog__BaseUrl
              value: http://catalog-service
            # AntiEntropySweeper - previously relied entirely on
            # AntiEntropyOptions' own code defaults, with no operator-facing
            # knob anywhere. Explicit here matching those defaults exactly.
            - name: AntiEntropy__SweepIntervalSeconds
              value: "300"
            - name: AntiEntropy__BatchSize
              value: "200"
            - name: AntiEntropy__PaymentsBaseUrl
              value: http://payments-service
            - name: AntiEntropy__InventoryBaseUrl
              value: http://inventory-service
            - name: AntiEntropy__ProjectionLagThresholdSeconds
              value: "120"
            # Missing entirely here previously - AntiEntropySweeper's two
            # cross-service HTTP calls (GET /payments/by-order,
            # GET /inventory/backorders) go through BearerTokenHandler,
            # which needs KeycloakTokenProvider to actually fetch a token.
            # KeycloakTokenProvider's own defaults (TokenUrl=localhost:18081,
            # ClientSecret="") are the same self-referencing-pod trap
            # Authentication__Authority already hit elsewhere in this
            # manifest set - every anti-entropy sweep tick would have failed
            # authentication silently. The secret this references
            # (keycloak-client-secret) is already in orders-runtime; it was
            # just never wired to this Deployment.
            - name: Keycloak__TokenUrl
              value: http://keycloak:8080/realms/orders-lab/protocol/openid-connect/token
            - name: Keycloak__ClientId
              value: orders-api-clients
            - name: Keycloak__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: orders-runtime
                  key: keycloak-client-secret
            - name: InstanceId
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=orders-lab
            - name: PYROSCOPE_PROFILING_ENABLED
              value: "1"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope:4040
            - name: PYROSCOPE_APPLICATION_NAME
              value: orders-worker
            # The CLR profiler attach variables - moved out of the Dockerfile's
            # own ENV (where they used to be unconditional and applied to
            # every environment, Compose included, regardless of
            # PYROSCOPE_PROFILING_ENABLED above) so a build with no
            # profiling configuration - Compose - genuinely runs with no
            # profiler attached, instead of CORECLR_ENABLE_PROFILING loading
            # one at process startup and only Pyroscope's own
            # PYROSCOPE_PROFILING_ENABLED (read after that point) deciding
            # whether it does anything. The .so files themselves stay baked
            # into the image - only the decision to attach lives here now.
            - name: CORECLR_ENABLE_PROFILING
              value: "1"
            - name: CORECLR_PROFILER
              value: "{BD1A650D-AC5D-4896-B64F-D6FA25D6B26A}"
            - name: CORECLR_PROFILER_PATH
              value: /opt/Pyroscope.Profiler.Native.so
            - name: LD_PRELOAD
              value: /opt/Pyroscope.Linux.ApiWrapper.x64.so
            - name: LD_LIBRARY_PATH
              value: /opt
            - name: LeaderElection__Namespace
              value: orders-lab
            - name: LeaderElection__LeaseName
              value: orders-worker-saga-sweeper
            # Orchestration is the normal path because it includes inventory
            # reservation. Sourced from saga-config so this and
            # payments-service's Saga__Mode can't drift apart.
            - name: Saga__Mode
              valueFrom:
                configMapKeyRef:
                  name: saga-config
                  key: mode
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 320Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 32Mi
