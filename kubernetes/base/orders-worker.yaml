apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-worker
  labels:
    app.kubernetes.io/name: orders-worker
    app.kubernetes.io/component: worker
spec:
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: saga-ecommerce
      annotations:
        linkerd.io/inject: enabled
    spec:
      serviceAccountName: orders-worker
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orders-worker
          image: saga-ecommerce/orders-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__Orders
              valueFrom:
                secretKeyRef:
                  name: orders-runtime
                  key: orders-connection-string
            - name: Kafka__BootstrapServers
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: bootstrap-servers
            - name: Kafka__OrderCreatedTopic
              value: orders.created.v1
            - name: Kafka__DeadLetterTopic
              value: orders.created.dlq.v1
            - name: Kafka__ConsumerGroup
              value: orders-worker
            - name: Kafka__ClientId
              value: orders-worker-k3s
            - name: PaymentResultKafka__BootstrapServers
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: bootstrap-servers
            - name: OrderProjectionKafka__BootstrapServers
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: bootstrap-servers
            - name: SagaOrchestration__BootstrapServers
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: bootstrap-servers
            - name: OrderEventStore__BootstrapServers
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: bootstrap-servers
            - name: SchemaRegistry__Url
              value: http://schema-registry:8081
            - name: Redis__ConnectionString
              value: redis:6379
            - name: Catalog__BaseUrl
              value: http://catalog-service
            - name: AntiEntropy__SweepIntervalSeconds
              value: "300"
            - name: AntiEntropy__BatchSize
              value: "200"
            - name: AntiEntropy__PaymentsBaseUrl
              value: http://payments-service
            - name: AntiEntropy__InventoryBaseUrl
              value: http://inventory-service
            - name: AntiEntropy__ProjectionLagThresholdSeconds
              value: "120"
            - name: Keycloak__TokenUrl
              value: http://keycloak:8080/realms/orders-lab/protocol/openid-connect/token
            - name: Keycloak__ClientId
              value: orders-worker
            - name: Keycloak__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: orders-runtime
                  key: keycloak-client-secret
            - name: InstanceId
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=orders-lab
            - name: PYROSCOPE_PROFILING_ENABLED
              value: "1"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope:4040
            - name: PYROSCOPE_APPLICATION_NAME
              value: orders-worker
            - name: CORECLR_ENABLE_PROFILING
              value: "1"
            - name: CORECLR_PROFILER
              value: "{BD1A650D-AC5D-4896-B64F-D6FA25D6B26A}"
            - name: CORECLR_PROFILER_PATH
              value: /opt/Pyroscope.Profiler.Native.so
            - name: LD_PRELOAD
              value: /opt/Pyroscope.Linux.ApiWrapper.x64.so
            - name: LD_LIBRARY_PATH
              value: /opt
            - name: LeaderElection__Namespace
              value: orders-lab
            - name: LeaderElection__LeaseName
              value: orders-worker-saga-sweeper
            - name: Saga__Mode
              valueFrom:
                configMapKeyRef:
                  name: saga-config
                  key: mode
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 320Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 32Mi
