apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-worker
  labels:
    app.kubernetes.io/name: orders-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: saga-ecommerce
      annotations:
        linkerd.io/inject: enabled
    spec:
      # Milestone 26: a dedicated ServiceAccount, not the namespace default
      # every other pod still uses - Linkerd's mTLS identity is derived from
      # the pod's ServiceAccount, so sharing "default" across every workload
      # (the case until this milestone) makes per-service AuthorizationPolicy
      # meaningless: every pod would present the same identity. This is what
      # lets kubernetes/cluster-policies/orders-api-authz.yaml distinguish
      # "a request that's actually orders-worker" from "a request that's
      # some other meshed pod."
      serviceAccountName: orders-worker
      # Milestone 36: flipped from false (Milestone 26's hardening default)
      # to true - LeaderElectionService needs the projected ServiceAccount
      # token to authenticate to the API server for Lease read/write.
      # RBAC (kubernetes/cluster-policies/orders-worker-leader-election.yaml)
      # scopes this ServiceAccount to nothing but Lease objects in this one
      # namespace - it still can't read Pods, Secrets, or anything else.
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orders-worker
          image: saga-ecommerce/orders-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__Orders
              valueFrom:
                secretKeyRef:
                  name: orders-runtime
                  key: orders-connection-string
            - name: Kafka__BootstrapServers
              value: kafka:9092
            - name: Kafka__OrderCreatedTopic
              value: orders.created.v1
            - name: Kafka__DeadLetterTopic
              value: orders.created.dlq.v1
            - name: Kafka__ConsumerGroup
              value: orders-worker
            - name: Kafka__ClientId
              value: orders-worker-k3s
            - name: PaymentResultKafka__BootstrapServers
              value: kafka:9092
            - name: OrderProjectionKafka__BootstrapServers
              value: kafka:9092
            - name: SagaOrchestration__BootstrapServers
              value: kafka:9092
            - name: OrderEventStore__BootstrapServers
              value: kafka:9092
            - name: SchemaRegistry__Url
              value: http://schema-registry:8081
            - name: Redis__ConnectionString
              value: redis:6379
            - name: Catalog__BaseUrl
              value: http://catalog-service
            - name: InstanceId
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=orders-lab
            - name: PYROSCOPE_PROFILING_ENABLED
              value: "1"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope:4040
            - name: PYROSCOPE_APPLICATION_NAME
              value: orders-worker
            - name: LeaderElection__Namespace
              value: orders-lab
            - name: LeaderElection__LeaseName
              value: orders-worker-saga-sweeper
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 320Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 32Mi
