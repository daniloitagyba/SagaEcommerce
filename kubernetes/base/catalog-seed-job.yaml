apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-seed-m40
  labels:
    app.kubernetes.io/name: catalog-seed
    app.kubernetes.io/component: migration
  annotations:
    # PostSync, not PreSync like the migration Jobs - seeding demo data has
    # no ordering requirement relative to the app pods (unlike a schema
    # migration, which must run before the app starts), only relative to
    # the mongodb Service existing. As a PreSync hook this job deadlocked:
    # PreSync hooks run before the main sync phase that creates that very
    # Service, something that never surfaced for the Postgres/Kafka-backed
    # PreSync migration jobs only because those Services already existed
    # from earlier milestones by the time those hooks were ever added.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-seed
        app.kubernetes.io/component: migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalog-seed
          image: saga-ecommerce/catalog-service:latest
          imagePullPolicy: IfNotPresent
          # Idempotent (CatalogSeeder no-ops if any category already
          # exists), safe to run on every sync like the migration Jobs.
          args: ["--seed"]
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            # Missing here previously - AddKeycloakJwtBearer throws during
            # service registration without it, crashing this Job before it
            # ever reaches the --seed branch. Must match compose.yaml's value.
            - name: Authentication__Authority
              value: http://keycloak:8080/realms/orders-lab
            - name: Mongo__ConnectionString
              value: mongodb://mongodb:27017
            - name: Mongo__DatabaseName
              value: catalog
            # Missing here previously - AddOrdersRedis's ConnectionMultiplexer
            # is a root singleton built with a factory that calls
            # ConnectionMultiplexer.Connect(...) synchronously, and this
            # service's ValidateOnBuild:true (Program.cs) constructs every
            # root singleton at app.Build() time. Absent this, RedisOptions
            # falls back to its own "localhost:6379" default, and Connect()
            # against that address inside this Job's own pod throws
            # immediately - crashing before --seed ever runs, the same
            # crash-before-the-branch-it-was-meant-to-reach bug class as
            # Authentication__Authority above, just for a dependency
            # CatalogSeeder itself never touches (BestsellersReader does).
            - name: Redis__ConnectionString
              value: redis:6379
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=orders-lab
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 32Mi
