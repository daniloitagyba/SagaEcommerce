apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-seed-m40
  labels:
    app.kubernetes.io/name: catalog-seed
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-seed
        app.kubernetes.io/component: migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalog-seed
          image: saga-ecommerce/catalog-service:latest
          imagePullPolicy: IfNotPresent
          args: ["--seed"]
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Authentication__Authority
              value: http://keycloak:8080/realms/orders-lab
            - name: Mongo__ConnectionString
              value: mongodb://mongodb:27017
            - name: Mongo__DatabaseName
              value: catalog
            - name: Redis__ConnectionString
              value: redis:6379
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=orders-lab
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 32Mi
