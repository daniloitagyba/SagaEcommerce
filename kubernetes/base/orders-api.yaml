apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/component: api
spec:
  replicas: 3
  revisionHistoryLimit: 2
  strategy:
    canary:
      maxUnavailable: 1
      maxSurge: 1
      steps:
        - setWeight: 33
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: orders-api-error-rate
        - setWeight: 66
        - pause: { duration: 20s }
        - setWeight: 100
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: distributed-ecommerce
      annotations:
        linkerd.io/inject: enabled
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # Milestone 65: see cart-service.yaml for the full rationale - a
      # no-op on this single-node cluster today, a real guardrail once a
      # second node exists.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: orders-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orders-api
          image: distributed-ecommerce/orders-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__Orders
              valueFrom:
                secretKeyRef:
                  name: orders-runtime
                  key: orders-connection-string
            - name: Kafka__BootstrapServers
              value: kafka:9092
            - name: Kafka__OrderCreatedTopic
              value: orders.created.v1
            - name: Kafka__ClientId
              value: orders-api
            - name: SchemaRegistry__Url
              value: http://schema-registry:8081
            - name: Authentication__Authority
              value: http://keycloak:8080/realms/orders-lab
            - name: Redis__ConnectionString
              value: redis:6379
            # Milestone 66: checkout prices line items against the live
            # catalog server-side, so orders-api now depends on
            # catalog-service. CatalogClientOptions defaults to
            # localhost:5080, which would resolve to the pod itself.
            - name: Catalog__BaseUrl
              value: http://catalog-service:8080
            - name: Cache__TimeToLiveSeconds
              value: "30"
            - name: Cache__LockTimeoutMilliseconds
              value: "2000"
            - name: Cache__LockRetryAttempts
              value: "3"
            - name: Cache__LockRetryDelayMilliseconds
              value: "50"
            - name: Idempotency__TimeToLiveHours
              value: "24"
            - name: Idempotency__LockTimeoutMilliseconds
              value: "2000"
            - name: Idempotency__LockRetryAttempts
              value: "5"
            - name: Idempotency__LockRetryDelayMilliseconds
              value: "100"
            - name: FeatureManagement__IdempotencyKey
              value: "true"
            - name: RateLimit__TokenLimit
              value: "80"
            - name: RateLimit__TokensPerPeriod
              value: "75"
            - name: RateLimit__ReplenishmentPeriodSeconds
              value: "1"
            - name: DistributedRateLimit__Limit
              value: "150"
            - name: DistributedRateLimit__WindowSeconds
              value: "10"
            - name: PYROSCOPE_PROFILING_ENABLED
              value: "1"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope:4040
            - name: PYROSCOPE_APPLICATION_NAME
              value: orders-api
            - name: InstanceId
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=orders-lab
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 8081
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              # Pyroscope's native profiler refuses to start below a 1-core
              # CPU limit ("CPU limit is too low for the profiler to work
              # properly" - logged at container startup with DD_TRACE_DEBUG=1).
              # Was 500m before continuous profiling was added.
              cpu: 1000m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/name: orders-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orders-api
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: grpc
      port: 81
      targetPort: grpc
      # "kubernetes.io/h2c" is the exact string Linkerd's outbound policy
      # controller recognizes for HTTP/2 cleartext (confirmed directly in
      # its source, policy-controller/core/src/outbound.rs's AppProtocol
      # parser) - anything else, including the seemingly-more-correct
      # "grpc", falls into an Unknown variant. Without the recognized
      # value, the outbound proxy never sets the ALPN hint that tells the
      # destination this is HTTP/2, and the receiving Server's
      # proxyProtocol: gRPC declaration then denies the connection outright
      # for arriving with no negotiated protocol at all.
      appProtocol: kubernetes.io/h2c
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orders-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
