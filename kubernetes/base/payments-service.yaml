apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-service
  labels:
    app.kubernetes.io/name: payments-service
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-service
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: saga-ecommerce
      annotations:
        linkerd.io/inject: enabled
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payments-service
          image: saga-ecommerce/payments-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__Payments
              valueFrom:
                secretKeyRef:
                  name: orders-runtime
                  key: payments-connection-string
            - name: Kafka__BootstrapServers
              value: kafka:9092
            - name: Kafka__OrderCreatedTopic
              value: orders.created.v1
            - name: Kafka__PaymentResultTopic
              value: payments.result.v1
            - name: Kafka__DeadLetterTopic
              value: payments.decisions.dlq.v1
            - name: Kafka__ConsumerGroup
              value: payments-service
            - name: Kafka__ClientId
              value: payments-service-k3s
            - name: PaymentDecisionRequest__BootstrapServers
              value: kafka:9092
            - name: SchemaRegistry__Url
              value: http://schema-registry:8081
            - name: InstanceId
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=orders-lab
            - name: PYROSCOPE_PROFILING_ENABLED
              value: "1"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope:4040
            - name: PYROSCOPE_APPLICATION_NAME
              value: payments-service
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              # Pyroscope's native profiler refuses to start below a 1-core
              # CPU limit ("CPU limit is too low for the profiler to work
              # properly" - logged at container startup with DD_TRACE_DEBUG=1).
              # Was 500m before continuous profiling was added.
              cpu: 1000m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 32Mi
