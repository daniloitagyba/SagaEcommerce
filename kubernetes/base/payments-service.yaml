apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-service
  labels:
    app.kubernetes.io/name: payments-service
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-service
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: saga-ecommerce
      annotations:
        linkerd.io/inject: enabled
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payments-service
          image: saga-ecommerce/payments-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            # Missing here previously - AddKeycloakJwtBearer throws during
            # service registration without it, before any health check runs.
            # Must match compose.yaml's value.
            - name: Authentication__Authority
              value: http://keycloak:8080/realms/orders-lab
            - name: ConnectionStrings__Payments
              valueFrom:
                secretKeyRef:
                  name: orders-runtime
                  key: payments-connection-string
            - name: Kafka__BootstrapServers
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: bootstrap-servers
            - name: Kafka__OrderCreatedTopic
              value: orders.created.v1
            - name: Kafka__PaymentResultTopic
              value: payments.result.v1
            - name: Kafka__DeadLetterTopic
              value: payments.decisions.dlq.v1
            - name: Kafka__ConsumerGroup
              value: payments-service
            - name: Kafka__ClientId
              value: payments-service-k3s
            - name: PaymentDecisionRequest__BootstrapServers
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: bootstrap-servers
            # Milestone 68/75: PaymentSettlementOptions binds its own
            # section with the same localhost:9092 default every other
            # Kafka options class here has - missing from this manifest
            # entirely until now, which would leave capture/void/refund
            # consumption silently trying to reach the pod itself.
            - name: PaymentSettlement__BootstrapServers
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: bootstrap-servers
            - name: SchemaRegistry__Url
              value: http://schema-registry:8081
            # Sourced from saga-config so this and orders-worker's
            # Saga__Mode can't drift apart.
            - name: Saga__Mode
              valueFrom:
                configMapKeyRef:
                  name: saga-config
                  key: mode
            # OutboxPublisher<PaymentsDbContext> - see orders-api's own
            # comment on these five.
            - name: Outbox__BatchSize
              value: "5"
            - name: Outbox__PollIntervalMilliseconds
              value: "500"
            - name: Outbox__MaximumRetryDelaySeconds
              value: "60"
            - name: Outbox__ClaimWindowSeconds
              value: "30"
            - name: Outbox__PendingSampleIntervalSeconds
              value: "10"
            - name: InstanceId
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=orders-lab
            - name: PYROSCOPE_PROFILING_ENABLED
              value: "1"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: http://pyroscope:4040
            - name: PYROSCOPE_APPLICATION_NAME
              value: payments-service
            # The CLR profiler attach variables - moved out of the Dockerfile's
            # own ENV (where they used to be unconditional and applied to
            # every environment, Compose included, regardless of
            # PYROSCOPE_PROFILING_ENABLED above) so a build with no
            # profiling configuration - Compose - genuinely runs with no
            # profiler attached, instead of CORECLR_ENABLE_PROFILING loading
            # one at process startup and only Pyroscope's own
            # PYROSCOPE_PROFILING_ENABLED (read after that point) deciding
            # whether it does anything. The .so files themselves stay baked
            # into the image - only the decision to attach lives here now.
            - name: CORECLR_ENABLE_PROFILING
              value: "1"
            - name: CORECLR_PROFILER
              value: "{BD1A650D-AC5D-4896-B64F-D6FA25D6B26A}"
            - name: CORECLR_PROFILER_PATH
              value: /opt/Pyroscope.Profiler.Native.so
            - name: LD_PRELOAD
              value: /opt/Pyroscope.Linux.ApiWrapper.x64.so
            - name: LD_LIBRARY_PATH
              value: /opt
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              # Pyroscope's native profiler refuses to start below a 1-core
              # CPU limit ("CPU limit is too low for the profiler to work
              # properly" - logged at container startup with DD_TRACE_DEBUG=1).
              # Was 500m before continuous profiling was added.
              cpu: 1000m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 32Mi
