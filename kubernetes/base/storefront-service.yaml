apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-service
  labels:
    app.kubernetes.io/name: storefront-service
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront-service
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: saga-ecommerce
      annotations:
        linkerd.io/inject: enabled
    spec:
      serviceAccountName: storefront-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # Milestone 65: see cart-service.yaml for the full rationale - a
      # no-op on this single-node cluster today, a real guardrail once a
      # second node exists.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: storefront-service
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: storefront-service
          image: saga-ecommerce/storefront-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: CatalogProxy__BaseUrl
              value: http://catalog-service
            - name: CartProxy__BaseUrl
              value: http://cart-service
            - name: OrdersProxy__BaseUrl
              value: http://orders-api
            - name: InventoryProxy__BaseUrl
              value: http://inventory-service
            - name: ProductSummary__HedgeDelayMilliseconds
              value: "20"
            - name: Keycloak__TokenUrl
              value: http://keycloak:8080/realms/orders-lab/protocol/openid-connect/token
            - name: Keycloak__ClientId
              value: orders-api-clients
            - name: Keycloak__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: orders-runtime
                  key: keycloak-client-secret
            - name: InstanceId
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=orders-lab
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-service
  labels:
    app.kubernetes.io/name: storefront-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: storefront-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: storefront-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront-service
