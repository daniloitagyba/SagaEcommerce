apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orders-worker-leader-election
  namespace: orders-lab
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orders-worker-leader-election
  namespace: orders-lab
subjects:
  - kind: ServiceAccount
    name: orders-worker
    namespace: orders-lab
roleRef:
  kind: Role
  name: orders-worker-leader-election
  apiGroup: rbac.authorization.k8s.io
