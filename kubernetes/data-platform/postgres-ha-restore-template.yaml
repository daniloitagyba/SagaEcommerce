apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: orders-ha-restored
  namespace: postgres-ha
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.4
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  bootstrap:
    recovery:
      source: orders-ha-backup-source
      recoveryTarget:
        targetTime: "REPLACE-WITH-A-REAL-TIMESTAMP-e.g.-2026-07-29 02:32:59.89764+00"
  externalClusters:
    - name: orders-ha-backup-source
      barmanObjectStore:
        destinationPath: s3://postgres-backups/orders-ha
        endpointURL: http://minio.orders-lab.svc.cluster.local:9000
        serverName: orders-ha
        s3Credentials:
          accessKeyId:
            name: minio-backup-credentials
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: minio-backup-credentials
            key: ACCESS_SECRET_KEY
  postgresql:
    parameters:
      max_connections: "50"
