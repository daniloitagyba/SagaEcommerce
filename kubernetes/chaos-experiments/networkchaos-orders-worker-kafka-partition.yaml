apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: partition-orders-worker-from-kafka
  namespace: orders-lab
spec:
  action: partition
  mode: all
  selector:
    namespaces:
      - orders-lab
    labelSelectors:
      app.kubernetes.io/name: orders-worker
  direction: both
  externalTargets:
    - "172.30.0.11"
  duration: "60s"
