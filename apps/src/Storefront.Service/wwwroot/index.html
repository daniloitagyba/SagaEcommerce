<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SagaEcommerce — Loja</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>Loja do Laboratório</h1>
    <button id="cart-toggle" class="cart-button" type="button">
      🛒 Carrinho <span id="cart-count" class="cart-count">0</span>
    </button>
  </header>

  <main id="content">
    <section id="bestsellers-global" class="section">
      <h2>Mais Vendidos</h2>
      <div class="product-grid" id="bestsellers-global-grid"></div>
    </section>

    <div id="category-sections"></div>
  </main>

  <aside id="cart-panel" class="cart-panel" hidden>
    <div class="cart-panel-header">
      <h2>Seu Carrinho</h2>
      <button id="cart-close" class="icon-button" type="button">✕</button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-footer">
      <label class="coupon-field" for="coupon-code">Cupom (opcional)</label>
      <input id="coupon-code" class="coupon-input" type="text" placeholder="SAVE10, SAVE20, HALFOFF" autocomplete="off" />
      <div class="cart-total">Total: <strong id="cart-total">R$ 0,00</strong></div>
      <button id="checkout-button" class="checkout-button" type="button">Finalizar Compra</button>
      <p id="checkout-message" class="checkout-message" hidden></p>
    </div>
  </aside>
  <div id="cart-overlay" class="cart-overlay" hidden></div>

  <footer class="site-footer">
    <p>Vitrine de demonstração para o <a href="https://github.com/daniloitagyba/SagaEcommerce" target="_blank" rel="noopener">SagaEcommerce</a> — Milestone 45.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
