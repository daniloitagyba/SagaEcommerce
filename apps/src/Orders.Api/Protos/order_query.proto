syntax = "proto3";

option csharp_namespace = "Orders.Api.Grpc";

package orders;

// Milestone 30: a gRPC mirror of GET /orders/{id} - not a replacement for
// the REST endpoint, a second transport for the same read, sharing the
// same GetOrderHandler underneath. gRPC runs over HTTP/2, where Linkerd's
// proxy load-balances per request rather than per long-lived connection
// (plain HTTP/1.1 keep-alive is balanced per connection) - the concrete
// difference this milestone exists to demonstrate.
service OrderQuery {
  rpc GetOrder (GetOrderRequest) returns (GetOrderResponse);
}

message GetOrderRequest {
  string id = 1;
}

message GetOrderResponse {
  string id = 1;
  string customer_id = 2;
  // Minor units (cents), matching how this figure is already stored
  // (orders.amount_cents, a Postgres bigint) and read back everywhere else
  // in this codebase - Order.Amount itself is derived from this column. A
  // decimal amount has no exact binary64 representation, so a plain
  // `double` here could report a different value than the REST endpoint
  // backed by the same GetOrderHandler for the identical order.
  int64 amount_cents = 3;
  string currency = 4;
  string status = 5;
  string created_at = 6;
  string correlation_id = 7;
  string instance_id = 8;
}
