server {
    listen 80 default_server;
    server_name *.sagaecommerce.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name storefront.sagaecommerce.test;

    ssl_certificate     /etc/nginx/conf.d/certs/lab.crt;
    ssl_certificate_key /etc/nginx/conf.d/certs/lab.key;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://storefront-service:8080;
    }
}

server {
    listen 443 ssl;
    server_name keycloak.sagaecommerce.test;

    ssl_certificate     /etc/nginx/conf.d/certs/lab.crt;
    ssl_certificate_key /etc/nginx/conf.d/certs/lab.key;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://keycloak:8080;
    }
}

server {
    listen 443 ssl;
    server_name orders.sagaecommerce.test;

    ssl_certificate     /etc/nginx/conf.d/certs/lab.crt;
    ssl_certificate_key /etc/nginx/conf.d/certs/lab.key;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://orders_api;
    }
}

