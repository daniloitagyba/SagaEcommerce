# Name-based HTTPS routing for *.sagaecommerce.test, additive to the
# existing per-port TLS listeners (storefront-tls.conf/keycloak-tls.conf)
# and the plain-HTTP orders.conf below - none of those change. Requires
# compose/nginx/certs/lab.crt+lab.key to carry a SAN matching these names
# (run scripts/infra/generate-lab-tls-cert.sh with a wildcard argument -
# see that script's own comment header) and requires the client machine to
# resolve each hostname to this host's LAN IP, e.g. via /etc/hosts - there
# is deliberately no LAN-wide DNS server here.
#
# Plain HTTP on 80 redirects to HTTPS uniformly: Chrome only grants a
# secure context (window.isSecureContext, needed by storefront-web's
# OIDC/PKCE login) to https://, localhost, or 127.0.0.1 - never a
# plain-HTTP hostname, even a friendly one like these - so there's no
# meaningful plain-HTTP variant worth serving for any of them.
server {
    listen 80 default_server;
    server_name *.sagaecommerce.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name storefront.sagaecommerce.test;

    ssl_certificate     /etc/nginx/conf.d/certs/lab.crt;
    ssl_certificate_key /etc/nginx/conf.d/certs/lab.key;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://storefront-service:8080;
    }
}

server {
    listen 443 ssl;
    server_name keycloak.sagaecommerce.test;

    ssl_certificate     /etc/nginx/conf.d/certs/lab.crt;
    ssl_certificate_key /etc/nginx/conf.d/certs/lab.key;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://keycloak:8080;
    }
}

# Nice-to-have for Postman/manual API testing - the browser never calls
# this directly (storefront-web proxies /api/* server-side). Reuses
# orders.conf's "orders_api" upstream (nginx resolves upstream names after
# parsing the whole http{} context, so conf.d include order doesn't
# matter).
server {
    listen 443 ssl;
    server_name orders.sagaecommerce.test;

    ssl_certificate     /etc/nginx/conf.d/certs/lab.crt;
    ssl_certificate_key /etc/nginx/conf.d/certs/lab.key;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://orders_api;
    }
}

