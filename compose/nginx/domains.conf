# Grafana (grafana.sagaecommerce.test above) is the actual dashboard/log
# entry point (Loki+Tempo+Prometheus datasources, anonymous viewer already
# enabled) - this stack has no Kibana/ELK. Alertmanager is included too as
# the natural companion for "what's currently firing".
server {
    listen 443 ssl;
    server_name alertmanager.sagaecommerce.test;

    ssl_certificate     /etc/nginx/conf.d/certs/lab.crt;
    ssl_certificate_key /etc/nginx/conf.d/certs/lab.key;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://alertmanager:9093;
    }
}
