# TLS-terminating proxy for Keycloak, additive to its own direct plain-HTTP
# publish (compose.yaml's KEYCLOAK_PORT) - see storefront-tls.conf for why
# this exists at all. X-Forwarded-Proto/Host let Keycloak (KC_PROXY_HEADERS:
# xforwarded on the keycloak service) emit "https" issuer/endpoint URLs for
# browsers that arrive here, even though the connection from nginx to
# Keycloak below is plain HTTP - without that, the discovery document would
# still advertise http:// endpoints and a storefront served over https would
# have every OIDC call blocked as mixed content.
#
# Requires compose/nginx/certs/lab.crt + lab.key - run
# scripts/generate-lab-tls-cert.sh (with your LAN IP as an argument) first.
server {
    listen 18443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/conf.d/certs/lab.crt;
    ssl_certificate_key /etc/nginx/conf.d/certs/lab.key;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://keycloak:8080;
    }
}
