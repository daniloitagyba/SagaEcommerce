# TLS-terminating proxy for storefront-service, additive to its own direct
# plain-HTTP publish (compose.yaml's STOREFRONT_PORT). Exists so a LAN
# device's browser gets a secure context (window.isSecureContext) - Chrome
# never grants that to a plain HTTP LAN IP, only to https://, localhost, or
# 127.0.0.1, and window.crypto.subtle (which the storefront's OIDC/PKCE
# login flow needs to build the PKCE code_challenge) only exists in a
# secure context. Without this, clicking "Sign in" (or "Add to cart" while
# signed out) throws inside oidc-client-ts's CryptoUtils.generateCodeChallenge,
# swallowed silently - no redirect, no console error, no network request.
#
# Requires compose/nginx/certs/lab.crt + lab.key - run
# scripts/generate-lab-tls-cert.sh (with your LAN IP as an argument) first.
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/conf.d/certs/lab.crt;
    ssl_certificate_key /etc/nginx/conf.d/certs/lab.key;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://storefront-service:8080;
    }
}
