# Deliberately left as "local-distributed-lab" through both the earlier
# rename to "distributed-ecommerce" and this one to "saga-ecommerce": this
# is Docker Compose's project name, used to prefix every container/network/
# volume that doesn't have an explicit name override - including the
# Postgres/Kafka/MongoDB data volumes already holding this lab's live data.
# Changing it would make `docker compose` look for differently-labeled
# containers and volumes than the ones actually running, stranding the
# existing data behind old labels rather than migrating it. A real rename
# of this would need a deliberate stop-and-relabel procedure, not a text
# substitution - see scripts/verify-compose-network-names.sh, the guard
# this exact class of drift got a script for last time.
name: local-distributed-lab

x-api-common: &api-common
  image: saga-ecommerce/orders-api:milestone-7
  profiles: ["compose-apps"]
  restart: unless-stopped
  # Note: orders-api-1/orders-api-2 below each redefine their own
  # `environment:` block, and a service-level key always wins over the one
  # merged in via `<<: *api-common` - YAML's merge key doesn't deep-merge
  # nested maps, it just fills in keys the service doesn't already have. So
  # anything added to `environment:` here has no effect on either of them;
  # only `migrations` (which defines a narrower `environment:` of its own
  # too) is in the same boat. Real environment values for all three live in
  # each service's own block below, not here.
  depends_on:
    migrations:
      condition: service_completed_successfully
    kafka-init:
      condition: service_completed_successfully
    schema-registry:
      condition: service_healthy
  networks:
    - frontend
    - backend
  mem_limit: 256m
  cpus: 0.50
  stop_grace_period: 20s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=100
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=5
      - -c
      - max_replication_slots=5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=orders --dbname=orders"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.10
    mem_limit: 512m
    cpus: 1.5
    stop_grace_period: 30s

  kafka:
    image: apache/kafka:4.1.1
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_K8S://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_K8S://kafka.orders-lab.svc.cluster.local:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_K8S:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 134217728
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9092'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.11
    mem_limit: 768m
    cpus: 1.00
    stop_grace_period: 30s

  # Milestone 47: an isolated 3-broker KRaft cluster used only to prove
  # out the acks=all / min.insync.replicas / unclean.leader.election
  # quadrant (scripts/kafka-quorum-durability-test.sh) - NOT a change to
  # the single-broker `kafka` service above that the live orders-lab saga
  # pipeline actually depends on. Same reasoning as Milestone 27's
  # deliberately separate postgres-ha cluster: proving a replication
  # pattern works earns the right to propose migrating the live topics to
  # it later, rather than experimenting with leader kills directly against
  # traffic real sagas depend on. Gated behind the `kafka-quorum-demo`
  # profile so it costs nothing on the shared host except when the
  # experiment is actually running.
  #
  # Controller quorum is on 3 DEDICATED controller-only nodes, separate
  # from the 3 broker-only nodes the test pauses/kills - first attempt
  # combined broker+controller on the same 3 nodes (like the single-node
  # `kafka` service does), and pausing 2 of them to shrink the ISR for the
  # replica-quorum experiment ALSO broke the KRaft controller quorum's own
  # majority, since those are the same 2 nodes: every metadata call
  # (`kafka-topics.sh --describe`) timed out cluster-wide with "Timed out
  # waiting to send the call: listTopics" - not a broker-data-plane
  # symptom, a controller-quorum-lost-majority one. Decoupling the two
  # roles is what makes it possible to degrade the replica ISR being
  # tested without also taking down the metadata layer needed to observe
  # and react to it.
  kafka-ctrl1: &kafka-ctrl-common
    image: apache/kafka:4.1.1
    profiles: ["kafka-quorum-demo"]
    environment: &kafka-ctrl-env
      CLUSTER_ID: 9w0JfbxPSS2SSeRqmN3pmg
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 101@kafka-ctrl1:9093,102@kafka-ctrl2:9093,103@kafka-ctrl3:9093
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      KAFKA_NODE_ID: 101
    networks: ["backend"]
    mem_limit: 320m
    cpus: 0.25

  kafka-ctrl2:
    <<: *kafka-ctrl-common
    environment:
      <<: *kafka-ctrl-env
      KAFKA_NODE_ID: 102

  kafka-ctrl3:
    <<: *kafka-ctrl-common
    environment:
      <<: *kafka-ctrl-env
      KAFKA_NODE_ID: 103

  kafka-q1: &kafka-quorum-common
    image: apache/kafka:4.1.1
    profiles: ["kafka-quorum-demo"]
    depends_on: [kafka-ctrl1, kafka-ctrl2, kafka-ctrl3]
    environment: &kafka-quorum-env
      CLUSTER_ID: 9w0JfbxPSS2SSeRqmN3pmg
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 101@kafka-ctrl1:9093,102@kafka-ctrl2:9093,103@kafka-ctrl3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-q1:9092
    healthcheck: &kafka-quorum-healthcheck
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9092'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks: ["backend"]
    mem_limit: 512m
    cpus: 0.5

  kafka-q2:
    <<: *kafka-quorum-common
    environment:
      <<: *kafka-quorum-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-q2:9092

  kafka-q3:
    <<: *kafka-quorum-common
    environment:
      <<: *kafka-quorum-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-q3:9092

  kafka-quorum-init:
    image: apache/kafka:4.1.1
    profiles: ["kafka-quorum-demo"]
    depends_on:
      kafka-q1:
        condition: service_healthy
      kafka-q2:
        condition: service_healthy
      kafka-q3:
        condition: service_healthy
    networks: ["backend"]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-q1:9092 --create --if-not-exists \
          --topic quorum-demo.events.v1 --partitions 1 --replication-factor 3

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Milestone 46 measured the gap left by `--save "" --appendonly no`
    # (Milestone 42 promoted Redis to the cart's system of record, but
    # nobody had measured what a crash actually costs since): killing
    # Redis mid-load lost 300/300 in-flight carts, every time. AOF
    # `everysec` closed that to 0/300 lost in the same test, at the same
    # p99 latency as no persistence at all (~6ms); `always` bought no
    # further measured durability here but cost a real p99 tax (~70ms) -
    # so `everysec` is the default, not `always`. See
    # docs/data/milestone-46-redis-durability.md for the numbers.
    #
    # Mode is still parameterized (not hardcoded) so
    # scripts/cart-redis-durability-test.sh can flip it with
    # --force-recreate for comparison: a `redis-cli CONFIG SET` only
    # changes the running process's in-memory config - when Docker
    # restarts this same container after a kill, it re-execs this literal
    # `command:`, silently reverting to whatever's hardcoded here.
    command: ["redis-server", "--save", "${REDIS_SAVE:-}", "--appendonly", "${REDIS_APPENDONLY:-yes}", "--appendfsync", "${REDIS_APPENDFSYNC:-everysec}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.13
    mem_limit: 128m
    cpus: 0.25
    stop_grace_period: 10s

  mongodb:
    # Milestone 40: the product catalog's store - heterogeneous per-category
    # attributes (a t-shirt has size/color, a laptop has RAM/CPU) are a
    # genuinely bad fit for the existing relational orders/payments schema
    # (EAV, a JSONB column, or one table per category all being worse),
    # not adopted just to have "a NoSQL milestone."
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: catalog
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.20
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 10s

  # Milestone 49: an isolated 3-node MongoDB replica set used only to prove
  # out secondaryPreferred stale reads and the w:majority latency cost
  # (scripts/mongo-replica-set-test.sh) - NOT a change to the standalone
  # `mongodb` service above that Catalog.Service actually depends on. Same
  # reasoning as Milestone 27's postgres-ha and Milestone 47's
  # kafka-quorum-demo: prove the pattern in isolation before proposing it
  # for the live store. Gated behind the `mongo-replicaset-demo` profile.
  mongo-rs1: &mongo-rs-common
    image: mongo:8.0
    profiles: ["mongo-replicaset-demo"]
    command: ["mongod", "--replSet", "rs-demo", "--bind_ip_all"]
    healthcheck: &mongo-rs-healthcheck
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: ["backend"]
    mem_limit: 256m
    cpus: 0.5

  mongo-rs2:
    <<: *mongo-rs-common

  mongo-rs3:
    <<: *mongo-rs-common

  mongo-rs-init:
    image: mongo:8.0
    profiles: ["mongo-replicaset-demo"]
    depends_on:
      mongo-rs1:
        condition: service_healthy
      mongo-rs2:
        condition: service_healthy
      mongo-rs3:
        condition: service_healthy
    networks: ["backend"]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mongosh --host mongo-rs1 --quiet --eval '
          try {
            rs.status();
            print("replica set already initiated");
          } catch (e) {
            rs.initiate({
              _id: "rs-demo",
              members: [
                { _id: 0, host: "mongo-rs1:27017", priority: 2 },
                { _id: 1, host: "mongo-rs2:27017", priority: 1 },
                { _id: 2, host: "mongo-rs3:27017", priority: 0, secondaryDelaySecs: 5 }
              ]
            });
            print("replica set initiated - mongo-rs3 is a deliberately-lagging secondary (secondaryDelaySecs: 5)");
          }
        '

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    restart: unless-stopped
    command: ["-host=0.0.0.0", "-config=/etc/toxiproxy/proxies.json"]
    volumes:
      - ./toxiproxy/proxies.json:/etc/toxiproxy/proxies.json:ro
    ports:
      - "127.0.0.1:${TOXIPROXY_ADMIN_PORT:-8474}:8474"
    networks:
      frontend:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.14
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 10s

  kafka-init:
    image: apache/kafka:4.1.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx128m
    command:
      - /bin/bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.created.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.created.dlq.v1 --partitions 1 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.result.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.decisions.dlq.v1 --partitions 1 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.result.dlq.v1 --partitions 1 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.projection.dlq.v1 --partitions 1 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic _schemas --partitions 1 --replication-factor 1 --config cleanup.policy=compact
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.decision-requested.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.decision-replied.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.decision-requested.dlq.v1 --partitions 1 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.capture-requested.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.void-requested.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.settlement-replied.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.settlement.dlq.v1 --partitions 1 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.refund-requested.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.restock-requested.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.restock-replied.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.reservation-requested.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.reservation-replied.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.reservation-commit-requested.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.reservation-commit-replied.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.reservation-release-requested.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.reservation-release-replied.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.replenishment-needed.v1 --partitions 3 --replication-factor 1 --config retention.ms=86400000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.reservation.dlq.v1 --partitions 1 --replication-factor 1 --config retention.ms=86400000
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50

  schema-registry:
    image: ghcr.io/aiven-open/karapace:6.2.1
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KARAPACE_BOOTSTRAP_URI: kafka:9092
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_PORT: 8081
      KARAPACE_ADVERTISED_HOSTNAME: schema-registry
      KARAPACE_TOPIC_NAME: _schemas
      KARAPACE_COMPATIBILITY: BACKWARD
    command: ["python3", "-m", "karapace"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/subjects"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.16
    mem_limit: 384m
    cpus: 0.50
    stop_grace_period: 10s

  # Milestone 26: the OIDC identity provider Orders.Api validates bearer
  # tokens against. Runs in "start-dev" mode with its embedded dev storage
  # (not Postgres-backed) - a deliberate scope boundary, same category as
  # Milestone 22's in-memory saga state: the point of this milestone is
  # proving OIDC/JWT validation and scope-based authorization actually work,
  # not building Keycloak HA. Realm/client/user provisioning is scripted
  # (scripts/keycloak-configure-realm.sh) against the admin REST API, so a
  # restart's fresh dev storage is reproducible from a clean command, not a
  # manual setup step.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HTTP_ENABLED: "true"
      # Fixed rather than left to reflect the connecting client's Host
      # header: K3s pods reach this service as "keycloak" (the Service
      # name), while host-run scripts must use the k3s-bridge fixed IP
      # directly (the published host port doesn't actually bind - see
      # scripts/keycloak-configure-realm.sh). Without a fixed hostname,
      # tokens obtained through each path would carry a different "iss"
      # claim and fail Orders.Api's issuer validation depending on which
      # address was used to request them.
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    command: ["start-dev"]
    ports:
      - "${LAB_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-18081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.17
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 10s

  # Milestone 27: S3-compatible object storage for CloudNativePG's WAL
  # archiving and base backups (Barman Cloud) - K3s's default
  # local-path-provisioner has no CSI snapshot support, so a volume-snapshot
  # backup approach isn't available on this cluster; an object store is the
  # practical option for a home-lab single-node setup.
  minio:
    # Only consumed by the Postgres HA backup path (kubernetes/data-platform/
    # postgres-ha-backup.yaml, scripts/postgres-ha-provision.sh) - not part
    # of the quickstart flow, so it doesn't run by default.
    profiles: ["postgres-ha"]
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio-admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - minio-data:/data
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.18
    mem_limit: 512m
    cpus: 0.50
    stop_grace_period: 10s

  # One-shot: creates the four Kafka topics Debezium Connect needs for its
  # own internal state (config/offset/status storage) plus the CDC output
  # topic - separate from kafka-init (which always runs) so these only get
  # created when the CDC path is actually exercised via
  # scripts/debezium-register-connector.sh.
  cdc-topics-init:
    profiles: ["cdc"]
    image: apache/kafka:4.1.1
    restart: "no"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx128m
    command:
      - /bin/bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic debezium-connect-configs --partitions 1 --replication-factor 1 --config cleanup.policy=compact
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic debezium-connect-offsets --partitions 5 --replication-factor 1 --config cleanup.policy=compact
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic debezium-connect-status --partitions 1 --replication-factor 1 --config cleanup.policy=compact
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders-cdc.public.outbox_messages --partitions 3 --replication-factor 1 --config retention.ms=86400000
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50

  debezium:
    # Not part of the quickstart flow - stays down until CDC is deliberately
    # exercised via scripts/debezium-register-connector.sh
    # (docs/messaging/milestone-21-debezium-cdc.md).
    profiles: ["cdc"]
    image: debezium/connect:2.7.3.Final
    restart: unless-stopped
    depends_on:
      cdc-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      # Routed through the existing "kafka" Toxiproxy proxy rather than
      # straight at kafka:9092 - Milestone 10's resilience-chaos.sh only
      # reroutes the K8s-facing EndpointSlice, which Debezium (a Compose-only
      # service) never touches, so this is the only way to fault-inject a
      # Kafka outage against Debezium's own connection without also
      # affecting K8s traffic.
      BOOTSTRAP_SERVERS: toxiproxy:19092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: debezium-connect-configs
      OFFSET_STORAGE_TOPIC: debezium-connect-offsets
      STATUS_STORAGE_TOPIC: debezium-connect-status
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium
    ports:
      - "127.0.0.1:${DEBEZIUM_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - backend
    mem_limit: 768m
    cpus: 0.75
    stop_grace_period: 10s

  migrations:
    profiles: ["compose-apps"]
    image: saga-ecommerce/orders-api:milestone-7
    build:
      context: ..
      dockerfile: apps/src/Orders.Api/Dockerfile
    restart: "no"
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Orders: Host=postgres;Port=5432;Database=orders;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["NONE"]
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50

  orders-api-1:
    <<: *api-common
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Orders: Host=postgres;Port=5432;Database=orders;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: kafka:9092
      Kafka__OrderCreatedTopic: orders.created.v1
      Kafka__ClientId: orders-api
      SchemaRegistry__Url: http://schema-registry:8081
      Redis__ConnectionString: redis:6379
      # appsettings.json defaults this to the k3s-bridge fixed IP
      # (172.30.0.17), which K3s pods and host-run scripts can reach but
      # orders-api-1/orders-api-2 cannot - they're only on frontend/backend,
      # not k3s-bridge. Override to the Compose-internal DNS name both are
      # already on the same network as.
      Authentication__Authority: http://keycloak:8080/realms/orders-lab
      # Milestone 66: checkout prices line items server-side against the
      # catalog, so orders-api now needs to reach it. CatalogClientOptions
      # defaults to localhost:5080, which resolves inside this container
      # itself rather than to catalog-service - the same
      # non-obvious-default trap the Kafka/Redis overrides above cover.
      Catalog__BaseUrl: http://catalog-service:8080
      InstanceId: orders-api-1

  orders-api-2:
    <<: *api-common
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Orders: Host=postgres;Port=5432;Database=orders;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: kafka:9092
      Kafka__OrderCreatedTopic: orders.created.v1
      Kafka__ClientId: orders-api
      SchemaRegistry__Url: http://schema-registry:8081
      Redis__ConnectionString: redis:6379
      Authentication__Authority: http://keycloak:8080/realms/orders-lab
      Catalog__BaseUrl: http://catalog-service:8080
      InstanceId: orders-api-2

  orders-worker:
    profiles: ["compose-apps"]
    image: saga-ecommerce/orders-worker:milestone-7
    build:
      context: ..
      dockerfile: apps/src/Orders.Worker/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Orders: Host=postgres;Port=5432;Database=orders;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: kafka:9092
      Kafka__OrderCreatedTopic: orders.created.v1
      Kafka__DeadLetterTopic: orders.created.dlq.v1
      Kafka__ConsumerGroup: orders-worker
      Kafka__ClientId: orders-worker-1
      SchemaRegistry__Url: http://schema-registry:8081
      Redis__ConnectionString: redis:6379
      Catalog__BaseUrl: http://catalog-service:8080
      InstanceId: orders-worker-1
      # PaymentResultConsumer/OrderProjectionConsumer/OrderSagaOrchestrator+
      # OrderSagaReplyConsumer/OrderEventStoreProjector each bind their own
      # options section (see the SectionName on each class) rather than
      # sharing KafkaOptions above - BootstrapServers defaults to
      # localhost:9092 in every one of them, which only resolves inside
      # this container itself, not the kafka service. Topics/consumer
      # groups/client IDs already default correctly and don't need
      # overriding here.
      PaymentResultKafka__BootstrapServers: kafka:9092
      OrderProjectionKafka__BootstrapServers: kafka:9092
      SagaOrchestration__BootstrapServers: kafka:9092
      OrderEventStore__BootstrapServers: kafka:9092
      # Milestone 65: Choreography (default, matches payments-service below),
      # Orchestration, or Both - see SagaMode's own comment for what each
      # mode starts/stops. Both requires payments-service to also be set to
      # Both so every request/reply pair has someone to talk to.
      Saga__Mode: Choreography
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrations:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 30s

  payments-service:
    profiles: ["compose-apps"]
    image: saga-ecommerce/payments-service:milestone-7
    build:
      context: ..
      dockerfile: apps/src/Payments.Service/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Payments: Host=postgres;Port=5432;Database=payments;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: kafka:9092
      Kafka__OrderCreatedTopic: orders.created.v1
      Kafka__PaymentResultTopic: payments.result.v1
      Kafka__DeadLetterTopic: payments.decisions.dlq.v1
      Kafka__ConsumerGroup: payments-service
      Kafka__ClientId: payments-service-1
      SchemaRegistry__Url: http://schema-registry:8081
      InstanceId: payments-service-1
      # PaymentDecisionRequestProcessor binds its own PaymentDecisionRequest
      # options section rather than sharing Kafka above - same
      # localhost:9092-default gap as orders-worker's extra Kafka options
      # classes.
      PaymentDecisionRequest__BootstrapServers: kafka:9092
      # Milestone 68: PaymentSettlementOptions has its own section and the
      # same localhost:9092 default - the trap this compose file has now hit
      # four times.
      PaymentSettlement__BootstrapServers: kafka:9092
      PaymentSettlement__ExpirySweepIntervalSeconds: "30"
      # Milestone 65: must match orders-worker's Saga__Mode above - see that
      # comment.
      Saga__Mode: Choreography
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 30s

  catalog-service:
    profiles: ["compose-apps"]
    image: saga-ecommerce/catalog-service:milestone-42-by-sku
    build:
      context: ..
      dockerfile: apps/src/Catalog.Service/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Mongo__ConnectionString: mongodb://mongodb:27017
      Mongo__DatabaseName: catalog
      Redis__ConnectionString: redis:6379
      InstanceId: catalog-service-1
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s

  inventory-service:
    profiles: ["compose-apps"]
    image: saga-ecommerce/inventory-service:milestone-41-inventory
    build:
      context: ..
      dockerfile: apps/src/Inventory.Service/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Inventory: Host=postgres;Port=5432;Database=inventory;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: kafka:9092
      Kafka__ReservationRequestedTopic: inventory.reservation-requested.v1
      Kafka__ReservationRepliedTopic: inventory.reservation-replied.v1
      Kafka__CommitRequestedTopic: inventory.reservation-commit-requested.v1
      Kafka__CommitRepliedTopic: inventory.reservation-commit-replied.v1
      Kafka__ReleaseRequestedTopic: inventory.reservation-release-requested.v1
      Kafka__ReleaseRepliedTopic: inventory.reservation-release-replied.v1
      Kafka__DeadLetterTopic: inventory.reservation.dlq.v1
      Kafka__ConsumerGroup: inventory-service
      Kafka__ClientId: inventory-service-1
      InstanceId: inventory-service-1
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s

  cart-service:
    profiles: ["compose-apps"]
    image: saga-ecommerce/cart-service:milestone-42-cart-redis-timeout-fix
    build:
      context: ..
      dockerfile: apps/src/Cart.Service/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Redis__ConnectionString: redis:6379
      Catalog__BaseUrl: http://catalog-service:8080
      InstanceId: cart-service-1
    depends_on:
      catalog-service:
        condition: service_started
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s

  storefront-service:
    profiles: ["compose-apps"]
    image: saga-ecommerce/storefront-service:milestone-45-storefront-token-fix
    build:
      context: ..
      dockerfile: apps/src/Storefront.Service/Dockerfile
    restart: unless-stopped
    ports:
      - "${LAB_BIND_ADDRESS:-127.0.0.1}:${STOREFRONT_PORT:-8089}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Points directly at one orders-api replica rather than through nginx -
      # this is a demo-scale simplification (no load balancing across the two
      # replicas from the storefront's checkout path), not a production choice.
      CatalogProxy__BaseUrl: http://catalog-service:8080
      CartProxy__BaseUrl: http://cart-service:8080
      OrdersProxy__BaseUrl: http://orders-api-1:8080
      InventoryProxy__BaseUrl: ${INVENTORY_PROXY_BASE_URL:-http://inventory-service:8080}
      ProductSummary__HedgeDelayMilliseconds: ${PRODUCT_SUMMARY_HEDGE_DELAY_MS:-0}
      Keycloak__TokenUrl: http://keycloak:8080/realms/orders-lab/protocol/openid-connect/token
      Keycloak__ClientId: orders-api-clients
      Keycloak__ClientSecret: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET is required}
      InstanceId: storefront-service-1
    depends_on:
      catalog-service:
        condition: service_started
      cart-service:
        condition: service_started
    networks:
      - backend
    mem_limit: 128m
    cpus: 0.25
    stop_grace_period: 10s

  nginx:
    profiles: ["compose-apps"]
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${LAB_BIND_ADDRESS:-127.0.0.1}:${ORDERS_PORT:-8088}:8080"
    volumes:
      - ./nginx/orders.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      orders-api-1:
        condition: service_healthy
      orders-api-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=- http://127.0.0.1:8080/nginx-health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - frontend
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 10s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: -Xms128m -Xmx192m
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - frontend
      - backend
    mem_limit: 256m
    cpus: 0.50


  tempo:
    image: grafana/tempo:2.10.5
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s

  pyroscope:
    # Only K3s Deployments set PYROSCOPE_PROFILING_ENABLED and the profiler
    # env vars (kubernetes/base/*.yaml) - no Compose service instruments
    # against it, so it stays down by default rather than idling for the
    # Compose quickstart (docs/architecture/continuous-profiling.md).
    profiles: ["profiling"]
    image: grafana/pyroscope:1.15.0
    restart: unless-stopped
    command: ["server"]
    volumes:
      - pyroscope-data:/data/pyroscope
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.19
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s

  loki-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /var/loki"]
    volumes:
      - loki-data:/var/loki
    networks:
      - backend
    mem_limit: 32m
    cpus: 0.10

  loki:
    image: grafana/loki:3.6.11
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    depends_on:
      loki-init:
        condition: service_completed_successfully
    volumes:
      - ../observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/var/loki
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-config.file=/etc/loki/loki.yaml", "-verify-config=true"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.12
      # rede overlay attachable compartilhada com outros projetos no mesmo host
      # (ex: Farmate), que reaproveitam esse collector em vez de montar stack própria.
      farmate-observability:
    mem_limit: 192m
    cpus: 0.50
    stop_grace_period: 20s

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks:
      - backend
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 10s

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - backend
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 10s

  prometheus:
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=512MB
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      otel-collector:
        condition: service_started
      node-exporter:
        condition: service_started
      alertmanager:
        condition: service_started
    networks:
      frontend:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.15
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s

  grafana:
    image: grafana/grafana:13.1.1
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - frontend
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s
networks:
  frontend:
  backend:
    internal: true
  k3s-bridge:
    # Same reasoning as the top-level project name above: this is the live
    # network's actual label, not renamed to avoid orphaning it.
    name: local-distributed-lab-k3s-bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  farmate-observability:
    external: true

volumes:
  postgres-data:
  kafka-data:
  tempo-data:
  loki-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  minio-data:
  pyroscope-data:
  mongodb-data:
  redis-data:
