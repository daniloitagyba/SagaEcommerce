name: local-distributed-lab

x-saga-mode: &saga-mode Orchestration

x-kafka-bootstrap: &kafka-bootstrap kafka:9092

x-api-common: &api-common
  image: saga-ecommerce/orders-api:dev
  profiles: ["compose-apps"]
  restart: unless-stopped
  depends_on:
    migrations:
      condition: service_completed_successfully
    kafka-init:
      condition: service_completed_successfully
    schema-registry:
      condition: service_healthy
  networks:
    - frontend
    - backend
  mem_limit: 256m
  cpus: 0.50
  stop_grace_period: 20s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=100
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=5
      - -c
      - max_replication_slots=5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=orders --dbname=orders"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.10
    mem_limit: 512m
    cpus: 1.5
    stop_grace_period: 30s

  kafka:
    image: apache/kafka:4.1.1
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_K8S://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_K8S://kafka.orders-lab.svc.cluster.local:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_K8S:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 134217728
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9092'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.11
    mem_limit: 768m
    cpus: 1.00
    stop_grace_period: 30s

  kafka-ctrl1: &kafka-ctrl-common
    image: apache/kafka:4.1.1
    profiles: ["kafka-quorum-demo"]
    environment: &kafka-ctrl-env
      CLUSTER_ID: 9w0JfbxPSS2SSeRqmN3pmg
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 101@kafka-ctrl1:9093,102@kafka-ctrl2:9093,103@kafka-ctrl3:9093
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      KAFKA_NODE_ID: 101
    networks: ["backend"]
    mem_limit: 320m
    cpus: 0.25

  kafka-ctrl2:
    <<: *kafka-ctrl-common
    environment:
      <<: *kafka-ctrl-env
      KAFKA_NODE_ID: 102

  kafka-ctrl3:
    <<: *kafka-ctrl-common
    environment:
      <<: *kafka-ctrl-env
      KAFKA_NODE_ID: 103

  kafka-q1: &kafka-quorum-common
    image: apache/kafka:4.1.1
    profiles: ["kafka-quorum-demo"]
    depends_on: [kafka-ctrl1, kafka-ctrl2, kafka-ctrl3]
    environment: &kafka-quorum-env
      CLUSTER_ID: 9w0JfbxPSS2SSeRqmN3pmg
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 101@kafka-ctrl1:9093,102@kafka-ctrl2:9093,103@kafka-ctrl3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-q1:9092
    healthcheck: &kafka-quorum-healthcheck
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9092'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks: ["backend"]
    mem_limit: 512m
    cpus: 0.5

  kafka-q2:
    <<: *kafka-quorum-common
    environment:
      <<: *kafka-quorum-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-q2:9092

  kafka-q3:
    <<: *kafka-quorum-common
    environment:
      <<: *kafka-quorum-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-q3:9092

  kafka-quorum-init:
    image: apache/kafka:4.1.1
    profiles: ["kafka-quorum-demo"]
    depends_on:
      kafka-q1:
        condition: service_healthy
      kafka-q2:
        condition: service_healthy
      kafka-q3:
        condition: service_healthy
    networks: ["backend"]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-q1:9092 --create --if-not-exists \
          --topic quorum-demo.events.v1 --partitions 1 --replication-factor 3

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "${REDIS_SAVE:-}", "--appendonly", "${REDIS_APPENDONLY:-yes}", "--appendfsync", "${REDIS_APPENDFSYNC:-everysec}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.13
    mem_limit: 128m
    cpus: 0.25
    stop_grace_period: 10s

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: catalog
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.20
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 10s

  mongo-rs1: &mongo-rs-common
    image: mongo:8.0
    profiles: ["mongo-replicaset-demo"]
    command: ["mongod", "--replSet", "rs-demo", "--bind_ip_all"]
    healthcheck: &mongo-rs-healthcheck
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: ["backend"]
    mem_limit: 256m
    cpus: 0.5

  mongo-rs2:
    <<: *mongo-rs-common

  mongo-rs3:
    <<: *mongo-rs-common

  mongo-rs-init:
    image: mongo:8.0
    profiles: ["mongo-replicaset-demo"]
    depends_on:
      mongo-rs1:
        condition: service_healthy
      mongo-rs2:
        condition: service_healthy
      mongo-rs3:
        condition: service_healthy
    networks: ["backend"]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mongosh --host mongo-rs1 --quiet --eval '
          try {
            rs.status();
            print("replica set already initiated");
          } catch (e) {
            rs.initiate({
              _id: "rs-demo",
              members: [
                { _id: 0, host: "mongo-rs1:27017", priority: 2 },
                { _id: 1, host: "mongo-rs2:27017", priority: 1 },
                { _id: 2, host: "mongo-rs3:27017", priority: 0, secondaryDelaySecs: 5 }
              ]
            });
            print("replica set initiated - mongo-rs3 is a deliberately-lagging secondary (secondaryDelaySecs: 5)");
          }
        '

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    restart: unless-stopped
    command: ["-host=0.0.0.0", "-config=/etc/toxiproxy/proxies.json"]
    volumes:
      - ./toxiproxy/proxies.json:/etc/toxiproxy/proxies.json:ro
    ports:
      - "127.0.0.1:${TOXIPROXY_ADMIN_PORT:-8474}:8474"
    networks:
      frontend:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.14
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 10s

  kafka-init:
    image: apache/kafka:4.1.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx128m
    command:
      - /bin/bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.created.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.status-changed.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.created.dlq.v1 --partitions 3 --replication-factor 1 --config retention.ms=2592000000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.result.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.decisions.dlq.v1 --partitions 3 --replication-factor 1 --config retention.ms=2592000000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.result.dlq.v1 --partitions 3 --replication-factor 1 --config retention.ms=2592000000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.projection.dlq.v1 --partitions 3 --replication-factor 1 --config retention.ms=2592000000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.saga.dlq.v1 --partitions 3 --replication-factor 1 --config retention.ms=2592000000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders.event-store.dlq.v1 --partitions 3 --replication-factor 1 --config retention.ms=2592000000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic _schemas --partitions 1 --replication-factor 1 --config cleanup.policy=compact
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.decision-requested.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.decision-replied.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.decision-requested.dlq.v1 --partitions 3 --replication-factor 1 --config retention.ms=2592000000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.capture-requested.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.cancellation-requested.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.settlement-replied.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.settlement.dlq.v1 --partitions 3 --replication-factor 1 --config retention.ms=2592000000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payments.refund-requested.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.restock-requested.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.backorder-cancellation-requested.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.restock-replied.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.reservation-requested.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.reservation-replied.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.reservation-commit-requested.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.reservation-commit-replied.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.reservation-release-requested.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.reservation-release-replied.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.replenishment-needed.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic inventory.reservation.dlq.v1 --partitions 3 --replication-factor 1 --config retention.ms=2592000000
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50

  schema-registry:
    image: ghcr.io/aiven-open/karapace:6.2.1
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KARAPACE_BOOTSTRAP_URI: kafka:9092
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_PORT: 8081
      KARAPACE_ADVERTISED_HOSTNAME: schema-registry
      KARAPACE_TOPIC_NAME: _schemas
      KARAPACE_COMPATIBILITY: BACKWARD
    command: ["python3", "-m", "karapace"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/subjects"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.16
    mem_limit: 384m
    cpus: 0.50
    stop_grace_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    command: ["start-dev"]
    ports:
      - "${LAB_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-18081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      frontend:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.17
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 10s

  minio:
    profiles: ["postgres-ha"]
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio-admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - minio-data:/data
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.18
    mem_limit: 512m
    cpus: 0.50
    stop_grace_period: 10s

  cdc-topics-init:
    profiles: ["cdc"]
    image: apache/kafka:4.1.1
    restart: "no"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx128m
    command:
      - /bin/bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic debezium-connect-configs --partitions 1 --replication-factor 1 --config cleanup.policy=compact
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic debezium-connect-offsets --partitions 5 --replication-factor 1 --config cleanup.policy=compact
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic debezium-connect-status --partitions 1 --replication-factor 1 --config cleanup.policy=compact
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic orders-cdc.public.outbox_messages --partitions 3 --replication-factor 1 --config retention.ms=604800000
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50

  debezium:
    profiles: ["cdc"]
    image: debezium/connect:2.7.3.Final
    restart: unless-stopped
    depends_on:
      cdc-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: toxiproxy:19092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: debezium-connect-configs
      OFFSET_STORAGE_TOPIC: debezium-connect-offsets
      STATUS_STORAGE_TOPIC: debezium-connect-status
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium
    ports:
      - "127.0.0.1:${DEBEZIUM_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - backend
    mem_limit: 768m
    cpus: 0.75
    stop_grace_period: 10s

  migrations:
    profiles: ["compose-apps"]
    image: saga-ecommerce/orders-api:dev
    build:
      context: ..
      dockerfile: apps/src/Orders.Api/Dockerfile
    restart: "no"
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Orders: Host=postgres;Port=5432;Database=orders;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: *kafka-bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["NONE"]
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50

  migrations-inventory:
    profiles: ["compose-apps"]
    image: saga-ecommerce/inventory-service:dev
    build:
      context: ..
      dockerfile: apps/src/Inventory.Service/Dockerfile
    restart: "no"
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Inventory: Host=postgres;Port=5432;Database=inventory;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: *kafka-bootstrap
      Authentication__Authority: http://keycloak:8080/realms/orders-lab
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["NONE"]
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50

  migrations-payments:
    profiles: ["compose-apps"]
    image: saga-ecommerce/payments-service:dev
    build:
      context: ..
      dockerfile: apps/src/Payments.Service/Dockerfile
    restart: "no"
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Payments: Host=postgres;Port=5432;Database=payments;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: *kafka-bootstrap
      Authentication__Authority: http://keycloak:8080/realms/orders-lab
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["NONE"]
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50

  seed-catalog:
    profiles: ["compose-apps"]
    image: saga-ecommerce/catalog-service:dev
    build:
      context: ..
      dockerfile: apps/src/Catalog.Service/Dockerfile
    restart: "no"
    command: ["--seed"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Mongo__ConnectionString: mongodb://mongodb:27017
      Mongo__DatabaseName: catalog
      Redis__ConnectionString: redis:6379
      Authentication__Authority: http://keycloak:8080/realms/orders-lab
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["NONE"]
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50

  seed-inventory:
    profiles: ["compose-apps"]
    image: saga-ecommerce/inventory-service:dev
    build:
      context: ..
      dockerfile: apps/src/Inventory.Service/Dockerfile
    restart: "no"
    command: ["--seed"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Inventory: Host=postgres;Port=5432;Database=inventory;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: *kafka-bootstrap
      Authentication__Authority: http://keycloak:8080/realms/orders-lab
    depends_on:
      migrations-inventory:
        condition: service_completed_successfully
    healthcheck:
      test: ["NONE"]
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50

  orders-api-1:
    <<: *api-common
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Orders: Host=postgres;Port=5432;Database=orders;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: *kafka-bootstrap
      Kafka__OrderCreatedTopic: orders.created.v1
      Kafka__ClientId: orders-api
      SchemaRegistry__Url: http://schema-registry:8081
      Redis__ConnectionString: redis:6379
      Authentication__Authority: http://keycloak:8080/realms/orders-lab
      Authentication__AlternateAuthority: ${PUBLIC_KEYCLOAK_URL:+${PUBLIC_KEYCLOAK_URL}/realms/orders-lab}
      Catalog__BaseUrl: http://catalog-service:8080
      InstanceId: orders-api-1
      Outbox__BatchSize: 5
      Outbox__PollIntervalMilliseconds: 500
      Outbox__MaximumRetryDelaySeconds: 60
      Outbox__ClaimWindowSeconds: 30
      Outbox__PendingSampleIntervalSeconds: 10

  orders-api-2:
    <<: *api-common
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Orders: Host=postgres;Port=5432;Database=orders;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: *kafka-bootstrap
      Kafka__OrderCreatedTopic: orders.created.v1
      Kafka__ClientId: orders-api
      SchemaRegistry__Url: http://schema-registry:8081
      Redis__ConnectionString: redis:6379
      Authentication__Authority: http://keycloak:8080/realms/orders-lab
      Authentication__AlternateAuthority: ${PUBLIC_KEYCLOAK_URL:+${PUBLIC_KEYCLOAK_URL}/realms/orders-lab}
      Catalog__BaseUrl: http://catalog-service:8080
      InstanceId: orders-api-2
      Outbox__BatchSize: 5
      Outbox__PollIntervalMilliseconds: 500
      Outbox__MaximumRetryDelaySeconds: 60
      Outbox__ClaimWindowSeconds: 30
      Outbox__PendingSampleIntervalSeconds: 10

  orders-worker:
    profiles: ["compose-apps"]
    image: saga-ecommerce/orders-worker:dev
    build:
      context: ..
      dockerfile: apps/src/Orders.Worker/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Orders: Host=postgres;Port=5432;Database=orders;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: *kafka-bootstrap
      Kafka__OrderCreatedTopic: orders.created.v1
      Kafka__DeadLetterTopic: orders.created.dlq.v1
      Kafka__ConsumerGroup: orders-worker
      Kafka__ClientId: orders-worker-1
      SchemaRegistry__Url: http://schema-registry:8081
      Redis__ConnectionString: redis:6379
      Catalog__BaseUrl: http://catalog-service:8080
      InstanceId: orders-worker-1
      PaymentResultKafka__BootstrapServers: *kafka-bootstrap
      OrderProjectionKafka__BootstrapServers: *kafka-bootstrap
      SagaOrchestration__BootstrapServers: *kafka-bootstrap
      OrderEventStore__BootstrapServers: *kafka-bootstrap
      Saga__Mode: *saga-mode
      Keycloak__TokenUrl: http://keycloak:8080/realms/orders-lab/protocol/openid-connect/token
      Keycloak__ClientId: orders-worker
      Keycloak__ClientSecret: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET is required}
      LeaderElection__Mode: SingleNode
      AntiEntropy__SweepIntervalSeconds: 300
      AntiEntropy__BatchSize: 200
      AntiEntropy__PaymentsBaseUrl: http://payments-service:8080
      AntiEntropy__InventoryBaseUrl: http://inventory-service:8080
      AntiEntropy__ProjectionLagThresholdSeconds: 120
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrations:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 30s

  payments-service:
    profiles: ["compose-apps"]
    image: saga-ecommerce/payments-service:dev
    build:
      context: ..
      dockerfile: apps/src/Payments.Service/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Payments: Host=postgres;Port=5432;Database=payments;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: *kafka-bootstrap
      Kafka__OrderCreatedTopic: orders.created.v1
      Kafka__PaymentResultTopic: payments.result.v1
      Kafka__DeadLetterTopic: payments.decisions.dlq.v1
      Kafka__ConsumerGroup: payments-service
      Kafka__ClientId: payments-service-1
      SchemaRegistry__Url: http://schema-registry:8081
      InstanceId: payments-service-1
      PaymentDecisionRequest__BootstrapServers: *kafka-bootstrap
      PaymentSettlement__BootstrapServers: *kafka-bootstrap
      PaymentSettlement__ExpirySweepIntervalSeconds: "30"
      Saga__Mode: *saga-mode
      Authentication__Authority: http://keycloak:8080/realms/orders-lab
      Authentication__AlternateAuthority: ${PUBLIC_KEYCLOAK_URL:+${PUBLIC_KEYCLOAK_URL}/realms/orders-lab}
      Outbox__BatchSize: 5
      Outbox__PollIntervalMilliseconds: 500
      Outbox__MaximumRetryDelaySeconds: 60
      Outbox__ClaimWindowSeconds: 30
      Outbox__PendingSampleIntervalSeconds: 10
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      migrations-payments:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 30s

  catalog-service:
    profiles: ["compose-apps"]
    image: saga-ecommerce/catalog-service:dev
    build:
      context: ..
      dockerfile: apps/src/Catalog.Service/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Mongo__ConnectionString: mongodb://mongodb:27017
      Mongo__DatabaseName: catalog
      Redis__ConnectionString: redis:6379
      Authentication__Authority: http://keycloak:8080/realms/orders-lab
      Authentication__AlternateAuthority: ${PUBLIC_KEYCLOAK_URL:+${PUBLIC_KEYCLOAK_URL}/realms/orders-lab}
      InstanceId: catalog-service-1
    depends_on:
      mongodb:
        condition: service_healthy
      seed-catalog:
        condition: service_completed_successfully
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s

  inventory-service:
    profiles: ["compose-apps"]
    image: saga-ecommerce/inventory-service:dev
    build:
      context: ..
      dockerfile: apps/src/Inventory.Service/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Inventory: Host=postgres;Port=5432;Database=inventory;Username=orders;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Kafka__BootstrapServers: *kafka-bootstrap
      Kafka__ReservationRequestedTopic: inventory.reservation-requested.v1
      Kafka__ReservationRepliedTopic: inventory.reservation-replied.v1
      Kafka__CommitRequestedTopic: inventory.reservation-commit-requested.v1
      Kafka__CommitRepliedTopic: inventory.reservation-commit-replied.v1
      Kafka__ReleaseRequestedTopic: inventory.reservation-release-requested.v1
      Kafka__ReleaseRepliedTopic: inventory.reservation-release-replied.v1
      Kafka__DeadLetterTopic: inventory.reservation.dlq.v1
      Kafka__ConsumerGroup: inventory-service
      Kafka__ClientId: inventory-service-1
      Authentication__Authority: http://keycloak:8080/realms/orders-lab
      Authentication__AlternateAuthority: ${PUBLIC_KEYCLOAK_URL:+${PUBLIC_KEYCLOAK_URL}/realms/orders-lab}
      InstanceId: inventory-service-1
      Outbox__BatchSize: 5
      Outbox__PollIntervalMilliseconds: 500
      Outbox__MaximumRetryDelaySeconds: 60
      Outbox__ClaimWindowSeconds: 30
      Outbox__PendingSampleIntervalSeconds: 10
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      seed-inventory:
        condition: service_completed_successfully
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s

  cart-service:
    profiles: ["compose-apps"]
    image: saga-ecommerce/cart-service:dev
    build:
      context: ..
      dockerfile: apps/src/Cart.Service/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Redis__ConnectionString: redis:6379
      Catalog__BaseUrl: http://catalog-service:8080
      Authentication__Authority: http://keycloak:8080/realms/orders-lab
      Authentication__AlternateAuthority: ${PUBLIC_KEYCLOAK_URL:+${PUBLIC_KEYCLOAK_URL}/realms/orders-lab}
      InstanceId: cart-service-1
    depends_on:
      catalog-service:
        condition: service_started
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s

  storefront-service:
    profiles: ["compose-apps"]
    image: saga-ecommerce/storefront-service:dev
    build:
      context: ..
      dockerfile: apps/src/Storefront.Service/Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL:-http://127.0.0.1:18081}
        VITE_KEYCLOAK_REALM: orders-lab
        VITE_KEYCLOAK_CLIENT_ID: orders-storefront
    restart: unless-stopped
    ports:
      - "${LAB_BIND_ADDRESS:-127.0.0.1}:${STOREFRONT_PORT:-8089}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CatalogProxy__BaseUrl: http://catalog-service:8080
      CartProxy__BaseUrl: http://cart-service:8080
      OrdersProxy__BaseUrl: http://orders-api-1:8080
      InventoryProxy__BaseUrl: ${INVENTORY_PROXY_BASE_URL:-http://inventory-service:8080}
      ProductSummary__HedgeDelayMilliseconds: ${PRODUCT_SUMMARY_HEDGE_DELAY_MS:-0}
      InstanceId: storefront-service-1
    depends_on:
      catalog-service:
        condition: service_started
      cart-service:
        condition: service_started
    networks:
      - frontend
      - backend
    mem_limit: 128m
    cpus: 0.25
    stop_grace_period: 10s

  nginx:
    profiles: ["compose-apps"]
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${LAB_BIND_ADDRESS:-127.0.0.1}:${ORDERS_PORT:-8088}:8080"
      - "${LAB_BIND_ADDRESS:-127.0.0.1}:${STOREFRONT_TLS_PORT:-8443}:8443"
      - "${LAB_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_TLS_PORT:-18443}:18443"
      - "${LAB_BIND_ADDRESS:-127.0.0.1}:${DOMAINS_HTTP_PORT:-80}:80"
      - "${LAB_BIND_ADDRESS:-127.0.0.1}:${DOMAINS_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      orders-api-1:
        condition: service_healthy
      orders-api-2:
        condition: service_healthy
      storefront-service:
        condition: service_started
      keycloak:
        condition: service_healthy
      grafana:
        condition: service_started
      prometheus:
        condition: service_started
      kafka-ui:
        condition: service_started
      alertmanager:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=- http://127.0.0.1:8080/nginx-health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - frontend
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 10s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: -Xms128m -Xmx192m
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - frontend
      - backend
    mem_limit: 256m
    cpus: 0.50


  tempo:
    image: grafana/tempo:2.10.5
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s

  pyroscope:
    profiles: ["profiling"]
    image: grafana/pyroscope:1.15.0
    restart: unless-stopped
    command: ["server"]
    volumes:
      - pyroscope-data:/data/pyroscope
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.19
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s

  loki-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /var/loki"]
    volumes:
      - loki-data:/var/loki
    networks:
      - backend
    mem_limit: 32m
    cpus: 0.10

  loki:
    image: grafana/loki:3.6.11
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    depends_on:
      loki-init:
        condition: service_completed_successfully
    volumes:
      - ../observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/var/loki
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-config.file=/etc/loki/loki.yaml", "-verify-config=true"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.12
    mem_limit: 192m
    cpus: 0.50
    stop_grace_period: 20s

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks:
      - backend
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 10s

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    restart: unless-stopped
    command:
      - --kafka.server=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 10s

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - frontend
      - backend
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 10s

  prometheus:
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=512MB
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      otel-collector:
        condition: service_started
      node-exporter:
        condition: service_started
      alertmanager:
        condition: service_started
    networks:
      frontend:
      backend:
      k3s-bridge:
        ipv4_address: 172.30.0.15
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s

  grafana:
    image: grafana/grafana:13.1.1
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - frontend
      - backend
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 20s
networks:
  frontend:
  backend:
    internal: true
  k3s-bridge:
    name: local-distributed-lab-k3s-bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres-data:
  kafka-data:
  tempo-data:
  loki-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  minio-data:
  pyroscope-data:
  mongodb-data:
  redis-data:
