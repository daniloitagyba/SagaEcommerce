name: mutation-testing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  mutate-buildingblocks-contracts:
    name: mutate BuildingBlocks.Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: restore dotnet tools
        run: dotnet tool restore

      - name: stryker
        working-directory: apps/src/BuildingBlocks.Contracts
        run: dotnet stryker

      - name: upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutation-report
          path: "apps/src/BuildingBlocks.Contracts/StrykerOutput/**/reports/*.html"
          retention-days: 30
