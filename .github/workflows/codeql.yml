name: codeql

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (csharp)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324
        with:
          languages: csharp
          queries: security-extended

      - name: build (CodeQL autobuild can't see multi-project .slnx solutions reliably)
        run: |
          dotnet restore apps/SagaEcommerce.slnx
          dotnet build apps/SagaEcommerce.slnx --no-restore --configuration Release

      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324
        with:
          category: "/language:csharp"
