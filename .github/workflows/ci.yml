name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # scan full history, not just the current diff - a secret committed once and later removed still leaked

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --redact --exit-code 1

  vulnerable-packages:
    name: known-CVE NuGet dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: restore
        run: dotnet restore apps/SagaEcommerce.slnx

      - name: list vulnerable packages (direct + transitive)
        run: |
          set -o pipefail
          dotnet list apps/SagaEcommerce.slnx package --vulnerable --include-transitive | tee vulnerable-packages.log
          if grep -q "has the following vulnerable packages" vulnerable-packages.log; then
            echo "::error::Vulnerable NuGet packages detected - see log above."
            exit 1
          fi

  complexity-and-module-size:
    # Keep the published check name stable: branch protection may require it by
    # name even though this job now owns additional repository-quality gates.
    name: cyclomatic complexity and module size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: GitHub Actions syntax and semantics (actionlint)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

      - name: shell script syntax
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find scripts compose -type f -name "*.sh" -print0)

      - name: shell script static analysis (ShellCheck)
        run: |
          mapfile -d '' scripts < <(find scripts compose -type f -name "*.sh" -print0)
          docker run --rm -v "$PWD:/repo" -w /repo koalaman/shellcheck-alpine:v0.10.0 \
            shellcheck --severity=warning "${scripts[@]}"

      - name: Dockerfile static analysis (Hadolint)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint hadolint hadolint/hadolint:v2.12.0-debian \
            apps/src/*/Dockerfile compose/nginx/Dockerfile

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.34.1

      - name: render Kubernetes manifests (Kustomize)
        run: |
          mkdir -p rendered-manifests
          found=0
          for overlay in kubernetes/overlays/*; do
            [[ -f "$overlay/kustomization.yaml" ]] || continue
            found=1
            kubectl kustomize "$overlay" > "rendered-manifests/${overlay##*/}.yaml"
          done
          [[ "$found" -eq 1 ]]

      - name: validate Kubernetes schemas (kubeconform)
        run: |
          # The rendered overlay contains CRDs (Argo Rollouts, KEDA and
          # SealedSecrets) whose schemas are not part of the upstream
          # Kubernetes schema bundle. Standard resources remain strict and
          # build-blocking; only resources without a published schema are
          # reported as skipped.
          for manifest in rendered-manifests/*.yaml; do
            docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 \
              -strict -summary -ignore-missing-schemas < "$manifest"
          done

      - name: test Kyverno admission policies
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/kyverno/kyverno-cli:v1.16.1 \
            test kubernetes/cluster-policies/tests

      - name: validate Prometheus configuration and alert rules
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint promtool prom/prometheus:v3.13.1 \
            check rules observability/prometheus/rules/*.yml
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint promtool prom/prometheus:v3.13.1 \
            check config observability/prometheus/prometheus.yml

      - name: validate Grafana dashboard JSON
        run: find observability/grafana/dashboards -name '*.json' -exec jq empty {} +

      - name: cyclomatic complexity (lizard)
        run: |
          # Threshold 20: the current worst offender (InventoryReservationMessageProcessor's
          # ProcessAsync/ProcessSettlementAsync, CCN 16-18) sits under it deliberately -
          # this gates further growth, not a demand to refactor working, tested message
          # processors as a side effect of adding the tool.
          docker run --rm -v "$PWD/apps/src:/src" python:3.12-slim sh -c \
            "pip install --quiet lizard && lizard /src --languages csharp --CCN 20"

      - name: module size (max 500 lines per file)
        run: |
          overlong=$(find apps/src -name "*.cs" -not -path "*/obj/*" -not -path "*/bin/*" -not -path "*Migrations*" -print0 \
            | xargs -0 wc -l | awk '$1 > 500 && $2 != "total" {print}')
          if [[ -n "$overlong" ]]; then
            echo "Files over the 500-line module-size budget:"
            echo "$overlong"
            exit 1
          fi
          echo "No source file exceeds 500 lines."

      - name: no swallowed exceptions (empty catch blocks)
        run: |
          # An empty catch block is a failure the codebase chose to make
          # invisible rather than handle - every real catch here logs,
          # rethrows, or returns a fallback value; this keeps it that way.
          # Plain Python regex over file text rather than grep -P, so this
          # doesn't depend on the runner's grep build supporting PCRE.
          python3 -c '
          import re, sys, glob
          pattern = re.compile(r"catch\s*\([^)]*\)\s*\{\s*\}")
          files = [f for f in glob.glob("apps/src/**/*.cs", recursive=True) if "/obj/" not in f and "/bin/" not in f]
          offenders = [f for f in files if pattern.search(open(f, encoding="utf-8", errors="ignore").read())]
          if offenders:
              print("Empty catch block(s) found - handle, log, or rethrow instead of swallowing:")
              print("\n".join(offenders))
              sys.exit(1)
          print("No empty catch blocks.")
          '

      - name: no hand-rolled inbox dedup SQL outside BuildingBlocks.Persistence
        run: |
          # The inbox half of every outbox-backed consumer's dedup
          # (INSERT INTO inbox_messages ... ON CONFLICT DO NOTHING) used to
          # be copy-pasted as raw SQL 8 times across Inventory.Service and
          # Payments.Service, alongside a properly shared InboxStore
          # Orders.Worker alone used - now consolidated into
          # BuildingBlocks.Persistence/InboxStore.cs (both its
          # standalone-connection and ambient-transaction variants). This
          # keeps a ninth consumer from reintroducing a copy instead of
          # calling InboxStore.TryRecordAsync/TryRecordWithinTransactionAsync.
          python3 -c '
          import glob, sys
          files = [
              f for f in glob.glob("apps/src/**/*.cs", recursive=True)
              if "/obj/" not in f and "/bin/" not in f
              and "BuildingBlocks.Persistence" not in f
          ]
          offenders = [f for f in files if "INSERT INTO inbox_messages" in open(f, encoding="utf-8", errors="ignore").read()]
          if offenders:
              print("Hand-rolled inbox dedup SQL found outside BuildingBlocks.Persistence - call InboxStore.TryRecordAsync/TryRecordWithinTransactionAsync instead:")
              print("\n".join(offenders))
              sys.exit(1)
          print("No hand-rolled inbox dedup SQL outside BuildingBlocks.Persistence.")
          '

      - name: no ambient clock in *Handler/*Sweeper types
        run: |
          # TimeProvider is registered as a singleton in every service and
          # already injected correctly in the components that most need it
          # (CartStore's CRDT merge, OrderPricingService, SagaTimeoutSweeper,
          # PaymentSettlementProcessor, ...). A direct DateTimeOffset.UtcNow/
          # DateTime.UtcNow call site in a *Handler or *Sweeper class is the
          # same bug ReturnOrderHandler had: a test that pins "now" via a
          # fake clock silently stops controlling what the code under test
          # actually compares against, because the code reads the real
          # clock instead of the one the test constructed. Found live in
          # ReturnOrderHandlerTests.cs, where a fixed Order.CreatedAt was
          # meant to be "10 days ago" and was actually growing more distant
          # from real UtcNow every day the test suite ran, permanently
          # pinning the regret-window boundary to one side.
          #
          # RetentionSweeper is the one documented exception: it is
          # deliberately deferred (BuildingBlocks-level retention
          # infrastructure with a wider blast radius than the business-rule
          # and deadline-sweeper call sites this check exists for) - see
          # docs/architecture/audit-2026-08-15-build-runtime-and-time-handling-review.md's
          # Phase 3.
          python3 -c '
          import glob, re, sys
          ALLOWLIST = {"apps/src/BuildingBlocks.Persistence/RetentionSweeper.cs"}
          files = [
              f for f in glob.glob("apps/src/**/*Handler.cs", recursive=True)
              + glob.glob("apps/src/**/*Sweeper.cs", recursive=True)
              if "/obj/" not in f and "/bin/" not in f and f not in ALLOWLIST
          ]
          pattern = re.compile(r"DateTime(Offset)?\.UtcNow")
          offenders = [f for f in files if pattern.search(open(f, encoding="utf-8", errors="ignore").read())]
          if offenders:
              print("Direct DateTime(Offset).UtcNow found in a *Handler/*Sweeper type - inject TimeProvider and call timeProvider.GetUtcNow() instead, or add a justified entry to ALLOWLIST in this check:")
              print("\n".join(sorted(offenders)))
              sys.exit(1)
          print("No ambient clock usage in *Handler/*Sweeper types outside the documented allowlist.")
          '

  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: verify compose network names
        run: bash scripts/infra/verify-compose-network-names.sh

      - name: verify compose/kubernetes config parity
        run: bash scripts/ci/verify-config-parity.sh

      - name: verify Dockerfile COPY lines match each service's ProjectReference graph
        run: bash scripts/ci/verify-dockerfile-project-references.sh

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: restore
        run: dotnet restore apps/SagaEcommerce.slnx

      - name: formatting and analyzer fixes are applied
        run: |
          dotnet format apps/SagaEcommerce.slnx --no-restore \
            --verify-no-changes --verbosity minimal

      - name: build
        run: dotnet build apps/SagaEcommerce.slnx --no-restore --configuration Release

      - name: fast tests (unit and architecture)
        run: |
          for project in \
            apps/tests/Orders.UnitTests/Orders.UnitTests.csproj \
            apps/tests/Storefront.UnitTests/Storefront.UnitTests.csproj \
            apps/tests/Cart.UnitTests/Cart.UnitTests.csproj \
            apps/tests/Catalog.UnitTests/Catalog.UnitTests.csproj \
            apps/tests/Inventory.UnitTests/Inventory.UnitTests.csproj \
            apps/tests/Payments.UnitTests/Payments.UnitTests.csproj \
            apps/tests/Orders.ArchitectureTests/Orders.ArchitectureTests.csproj \
            apps/tests/Services.ArchitectureTests/Services.ArchitectureTests.csproj; do
            dotnet test "$project" --no-build --configuration Release \
              --logger "trx;LogFileName=test-results.trx"
          done

      - name: publish test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: "apps/**/TestResults/**/*.trx"
          retention-days: 14

      - name: coverage (unit tests only)
        if: always()
        run: |
          # Deliberately scoped to the *.UnitTests projects, not the whole
          # solution: coverlet's instrumentation overhead, applied to the
          # Integration test projects, was enough to blow through
          # RedisOrderCache/RedisIdempotencyStore's 150ms Polly timeout
          # (ResilienceExtensions.RedisPipeline) on GitHub-hosted runners -
          # turning a real cache Hit/Miss into a resilience Bypass and
          # failing RedisOrderCacheTests/RedisIdempotencyStoreTests, a false
          # regression introduced by adding coverage collection itself, not
          # by any product change. Unit tests never touch a real Redis/
          # Postgres/Kafka Testcontainer, so they carry none of that risk.
          # Cart.UnitTests/Catalog.UnitTests/Inventory.UnitTests joined this
          # scope once each service had genuinely Docker-free business-rule
          # tests to run (some moved out of their *.IntegrationTests project,
          # where they'd been stranded needing no Testcontainer at all).
          for project in \
            apps/tests/Orders.UnitTests/Orders.UnitTests.csproj \
            apps/tests/Storefront.UnitTests/Storefront.UnitTests.csproj \
            apps/tests/Cart.UnitTests/Cart.UnitTests.csproj \
            apps/tests/Catalog.UnitTests/Catalog.UnitTests.csproj \
            apps/tests/Inventory.UnitTests/Inventory.UnitTests.csproj \
            apps/tests/Payments.UnitTests/Payments.UnitTests.csproj; do
            dotnet test "$project" --no-build --configuration Release \
              --collect:"XPlat Code Coverage" --results-directory ./coverage
          done

      - name: coverage report
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          # classfilters excludes EF migrations (Orders.Infrastructure/
          # Payments.Service/Inventory.Service each have one
          # *.Data.Migrations namespace, same pattern) and the EF model
          # snapshot that lives alongside them - ~10,443 lines of
          # generated code with zero meaningful branches, that no test
          # here is meant to exercise and that only grows with every
          # schema change. Left in, the line-coverage percentage was
          # structurally depressed and fell a little further on every
          # new migration regardless of how much real code got tested -
          # forcing the threshold down over time instead of the
          # threshold tracking actual test investment.
          reportgenerator -reports:"./coverage/**/coverage.cobertura.xml" \
            -targetdir:./coverage/report -reporttypes:"Html;TextSummary" \
            -classfilters:"-*.Migrations.*"
          cat ./coverage/report/Summary.txt

      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: ./coverage/report
          retention-days: 30

      - name: enforce coverage threshold
        run: |
          # 18.0% - a real margin under the 18.8% measured baseline
          # (recalibrated 2026-08-11, two compounding changes at once):
          #   1. The coverage report step above now excludes EF migrations
          #      (-classfilters:"-*.Migrations.*") - ~10,443 lines of
          #      generated code with zero meaningful branches that
          #      structurally depressed every measurement before this and
          #      would only get worse with each new migration, forcing the
          #      threshold down over time regardless of actual test
          #      investment.
          #   2. Payments.UnitTests joined this scope (previously zero
          #      dedicated coverage for Payments.Service - it lived
          #      scattered in Orders.UnitTests under the wrong project
          #      entirely), plus new coverage for Orders.Application's read
          #      handlers (GetOrder/GetOrderHistory/ListOrderSummaries) and
          #      BuildingBlocks.Messaging's dead-letter publisher base -
          #      previously uncovered anywhere despite the second being
          #      shared by every service's dead-letter path.
          # Was 7.0% against a 7.7% baseline (2026-08-10, migrations still
          # included). Coverage collection deliberately excludes the
          # Integration/Contract test projects (see the "coverage (unit
          # tests only)" step above), so this number is intentionally far
          # below what the whole solution's tests exercise - it only gates
          # the six *.UnitTests projects regressing, not overall solution
          # coverage.
          threshold="18.0"
          line_coverage=$(grep -oE "Line coverage: [0-9.]+%" ./coverage/report/Summary.txt | grep -oE "[0-9.]+")
          echo "Line coverage: ${line_coverage}%"
          awk -v cov="$line_coverage" -v threshold="$threshold" 'BEGIN { exit !(cov >= threshold) }' \
            || { echo "Line coverage ${line_coverage}% is below the ${threshold}% threshold."; exit 1; }

  integration-test:
    name: integration and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: restore
        run: dotnet restore apps/SagaEcommerce.slnx

      - name: build
        run: dotnet build apps/SagaEcommerce.slnx --no-restore --configuration Release

      - name: Testcontainers-backed integration and contract tests
        run: |
          for project in \
            apps/tests/Cart.IntegrationTests/Cart.IntegrationTests.csproj \
            apps/tests/Catalog.IntegrationTests/Catalog.IntegrationTests.csproj \
            apps/tests/Inventory.IntegrationTests/Inventory.IntegrationTests.csproj \
            apps/tests/Orders.IntegrationTests/Orders.IntegrationTests.csproj \
            apps/tests/Orders.ContractTests/Orders.ContractTests.csproj; do
            dotnet test "$project" --no-build --configuration Release \
              --logger "trx;LogFileName=test-results.trx"
          done

      - name: publish integration test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-test-results
          path: "apps/**/TestResults/**/*.trx"
          retention-days: 14

  frontend:
    name: storefront-web (lint, typecheck, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/storefront-web/package-lock.json

      - name: install
        working-directory: apps/storefront-web
        run: npm ci

      - name: audit direct and transitive npm dependencies
        working-directory: apps/storefront-web
        run: npm audit --audit-level=high

      - name: lint
        working-directory: apps/storefront-web
        run: npm run lint

      - name: build (includes tsc typecheck)
        working-directory: apps/storefront-web
        run: npm run build

      - name: test
        working-directory: apps/storefront-web
        run: npm test

  build-and-push:
    name: build, scan, sign (${{ matrix.service }})
    # storefront-service's image bakes in the storefront-web build (see its
    # Dockerfile), so a broken frontend must block that image the same way
    # a broken backend test blocks the rest - gating the whole matrix on
    # both jobs is simpler than splitting storefront-service into its own
    # job just to scope this dependency to one matrix entry.
    needs: [test, integration-test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # required for cosign keyless (Sigstore/Fulcio) signing
    strategy:
      matrix:
        include:
          - service: orders-api
            project: Orders.Api
          - service: orders-worker
            project: Orders.Worker
          - service: payments-service
            project: Payments.Service
          - service: catalog-service
            project: Catalog.Service
          - service: inventory-service
            project: Inventory.Service
          - service: cart-service
            project: Cart.Service
          - service: storefront-service
            project: Storefront.Service
    env:
      # Hardcoded lowercase rather than ghcr.io/${{ github.repository }}:
      # the repo name is mixed-case (SagaEcommerce) and Docker/OCI
      # registry paths must be lowercase - github.repository would produce
      # an invalid tag.
      IMAGE: ghcr.io/daniloitagyba/saga-ecommerce/${{ matrix.service }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish the immutable commit tag only. Promotion resolves that tag to
      # its digest, verifies the signature below and writes the digest into an
      # environment overlay; no mutable tag is consumed by GitOps.
      - name: build and push (sha tag only)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/src/${{ matrix.project }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 90

      - name: scan for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: sign image (keyless, Sigstore)
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: record immutable image provenance
        run: |
          jq --null-input \
            --arg service "${{ matrix.service }}" \
            --arg image "${IMAGE}" \
            --arg revision "${{ github.sha }}" \
            --arg digest "${DIGEST}" \
            '{service:$service,image:$image,revision:$revision,digest:$digest}' \
            > "image-${{ matrix.service }}.json"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: upload immutable image provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-provenance-${{ matrix.service }}
          path: image-${{ matrix.service }}.json
          retention-days: 90
