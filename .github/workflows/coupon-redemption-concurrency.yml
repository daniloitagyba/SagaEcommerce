name: coupon-redemption-concurrency

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  coupon-redemption-concurrency:
    name: coupon redemption concurrency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: generate throwaway compose credentials
        working-directory: compose
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -hex 24)"
            echo "KEYCLOAK_CLIENT_SECRET=$(openssl rand -hex 24)"
            echo "KEYCLOAK_DEMO_CUSTOMER_PASSWORD=$(openssl rand -hex 24)"
            echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 24)"
            echo "LAB_BIND_ADDRESS=127.0.0.1"
          } >> .env

      - name: bring up infrastructure
        working-directory: compose
        run: docker compose up --detach --wait

      - name: bring up application services
        working-directory: compose
        run: docker compose --profile compose-apps up --detach --wait

      - name: configure the Keycloak realm
        run: bash scripts/infra/keycloak-configure-realm.sh

      - name: run the concurrency test
        run: bash scripts/live-proofs/coupon-redemption-concurrency-test.sh

      - name: dump service logs on failure
        if: failure()
        working-directory: compose
        run: docker compose --profile compose-apps logs --tail 200

      - name: tear down
        if: always()
        working-directory: compose
        run: |
          docker compose --profile compose-apps down --volumes
          docker compose down --volumes
